      if(provs && provs.length) DIC.proveedores = provs.map(p=>({codigo:p.codigo, razon:p.razon||'', comercial:p.comercial||p.razon||'', cuit:p.cuit||'', tel:p.tel||'', movil:p.movil||'', email:p.email||'', web:p.web||'', provincia_cod:p.provincia_cod||'', provincia:p.provincia||'', actividad:p.actividad||'', iva:p.iva||'', domicilio:p.domicilio||'', cod_postal:p.cod_postal||'', tel2:p.tel2||''}));
    }catch(e){ /* si la tabla está vacía o falla, queda el ejemplo embebido */ }
    // Artículos: idem
    try{
      const arts = await sbFetchAll('/articulos?select=codigo,descripcion,desc_adicional,sinonimo,cuenta_cod,cuenta&order=codigo.asc');
      if(arts && arts.length) DIC.articulos = arts.map(a=>({codigo:a.codigo, descripcion:a.descripcion||'', desc_adicional:a.desc_adicional||'', sinonimo:a.sinonimo||'', cuenta_cod:a.cuenta_cod||'', cuenta:a.cuenta||''}));
    }catch(e){ /* queda el ejemplo embebido */ }
    // Depósitos: diccionario nuevo, sincronizado desde Tango
    try{
      const deps = await sbFetchAll('/depositos?select=codigo,descripcion,direccion,inhabilitado,sucursal&order=codigo.asc');
      if(deps) DIC.depositos = deps.map(d=>({codigo:d.codigo, descripcion:d.descripcion||'', direccion:d.direccion||'', inhabilitado:d.inhabilitado||'No', sucursal:d.sucursal||''}));
    }catch(e){ /* si la tabla no existe todavía, queda vacío */ }
    // Contabilidad (cuentas + auxiliares): RLS en Supabase oculta lo confidencial a quien no tiene permiso
    try{
      const cu=await sbFetchAll('/cuentas_contables?select=cod,descripcion,clase,tipo,saldo,usa_aux,habil,confidencial&order=cod.asc');
      if(cu&&cu.length) CONTA_DB.cuentas=cu.map(r=>({cod:r.cod,desc:r.descripcion||'',clase:r.clase||'',tipo:r.tipo||'',saldo:r.saldo||'',usa_aux:r.usa_aux||'',habil:r.habil||'',confidencial:!!r.confidencial}));
    }catch(e){}
    try{
      const tp=await sbFetch('/aux_tipos?select=cod,descripcion,confidencial&order=cod.asc');
      if(tp&&tp.length) CONTA_DB.tipos=tp.map(t=>({cod:t.cod,desc:t.descripcion||'',confidencial:!!t.confidencial}));
      const op=await sbFetchAll('/aux_opciones?select=tipo_cod,cod,descripcion,habil,confidencial&order=tipo_cod.asc');
      if(op&&op.length){ const m={}; op.forEach(o=>{ (m[o.tipo_cod]=m[o.tipo_cod]||[]).push({cod:o.cod,desc:o.descripcion||'',habil:o.habil||'',confidencial:!!o.confidencial}); }); CONTA_DB.auxopc=m; }
    }catch(e){}
    // Reglas del motor de asiento por clasificación (Supabase pisa la semilla embebida; un vacío no pisa)
    try{
      const cr=await sbFetch('/clasif_renglon?select=codigo,eerr,cuenta_cod,aux,nqnable,migrado');
      if(cr&&cr.length){ let n=0; cr.forEach(r=>{ const cod=String(r.codigo||'').toUpperCase().trim();
        if(cod && r.eerr){ CLASIF_RULES[cod]={eerr:r.eerr, cuenta:r.cuenta_cod||null, aux:r.aux||'none', nqnable:!!r.nqnable, migrado:!!r.migrado}; n++; } });
        window.__clasifRulesN=n; }
    }catch(e){ /* si la tabla no tiene las columnas del motor, queda la semilla embebida */ }
    // Combo de clasificación de renglón (lista seleccionable con "habilitado para compras") — Supabase pisa la semilla embebida
    try{
      const cc=await sbFetchAll('/clasif_comprobantes?select=cod,descripcion,habil_comp,categoria&order=cod.asc');
      if(cc&&cc.length){
        CLASIF_ALL.length=0;
        cc.forEach(r=>CLASIF_ALL.push({cod:r.cod, desc:r.descripcion||r.cod, habil_comp:r.habil_comp||'No', categoria:(r.categoria||'').trim()||_catDe(r.cod)}));
        const habilitados=CLASIF_ALL.filter(r=>String(r.habil_comp||'').toLowerCase()==='si').map(r=>({codigo:r.cod, desc:r.desc}));
        if(habilitados.length){ CLASIF_RENGLON.length=0; habilitados.forEach(r=>CLASIF_RENGLON.push(r)); }
        CLASIF_FROM_SUPABASE=true;
      }
    }catch(e){ /* si la tabla no existe todavía, queda la semilla embebida */ }
    // Series activas (individualización de módulos/herramientas/rodados/muebles con su depósito actual)
    try{
      const sa=await sbFetchAll('/series_activas?select=serie,familia,cod_deposito,desc_deposito,cod_articulo,descripcion,comentario,adicional_1,adicional_2,codigo_barras,partida,numero_despacho&order=serie.asc');
      if(sa&&sa.length){ SERIES_ACTIVAS.length=0; sa.forEach(r=>SERIES_ACTIVAS.push({...r})); SERIES_FROM_SUPABASE=true; }
    }catch(e){ /* si la tabla no existe todavía, queda vacío */ }
    // Usuarios (para desplegables Comprador / Certifica la OG) — desde la vista pública (solo nombre + flags)
    try{
      const us=await sbFetch('/usuarios_publicos?select=nombre,es_comprador,es_certificador&order=nombre.asc');
      if(us) USUARIOS=us;
    }catch(e){ /* si la vista no existe o no se puede leer, queda vacío */ }
  }catch(e){ toast('No se pudieron cargar los datos desde la nube.'); }
}
