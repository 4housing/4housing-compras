    const tc=(o.tc_pesos!=null && o.tc_pesos!=='')?+o.tc_pesos:null;
    // Pendiente en cada moneda. ARS estimado con el TC de la OG (el tesorero puede cambiarlo al pagar).
    let mUSD=null, mARS=null;
    if(mon==='USD'){ mUSD=pend; mARS = tc? pend*tc : null; }
    else { mARS=pend; mUSD = tc? pend/tc : null; }
    return '<tr>'
      +'<td><strong>'+esc(o.numero)+'</strong><div style="font-size:11px;color:var(--muted)">'+esc(o.proveedor||'')+'</div></td>'
      +'<td>'+(o.clasif_og?esc(o.clasif_og):esc(o.objeto||''))+'</td>'
      +'<td>'+ogLiberadoPct(o).toFixed(0)+'% liberado'+(pagadoPct>0?'<div style="font-size:11px;color:var(--muted)">'+pagadoPct.toFixed(0)+'% pagado</div>':'')+'</td>'
      +'<td>'+esc(o.certificador||'—')+'</td>'
      +'<td style="font-size:11px">'+esc(o.condicion||'—')+'</td>'
      +'<td>'+badge(mon==='USD'?'USD':'Pesos')+'</td>'
      +'<td style="text-align:right">'+(tc?fmtNum(tc,2):'—')+'</td>'
      +'<td style="text-align:right">'+(mUSD!=null?'US$ '+fmt2(mUSD):'—')+'</td>'
      +'<td style="text-align:right"><strong>'+(mARS!=null?'$ '+fmt2(mARS):'—')+'</strong></td>'
      +'<td><div class="row-actions"><button class="btn ghost sm" onclick="verRespaldo('+o.id+')">Ver respaldo</button>'
      +'<button class="btn ghost sm" onclick="openImputacion('+o.id+')">Imputación</button>'
      +'<button class="btn sm" onclick="openPago('+o.id+')">Registrar pago</button></div></td></tr>';
  }).join('');
  return '<div class="card"><div class="card-h"><h3>Cola de pagos'+demoTag+'</h3><span class="meta">Certificado y liberado, pendiente de pago. El Monto ARS es estimado con el TC de la OG.</span><button class="btn ghost sm" style="margin-left:auto" onclick="exportAsientoTodas()">Exportar asiento (CAJA)</button><button class="btn sm" style="margin-left:8px" onclick="exportAsientoTango()">Exportar asiento (Tango)</button></div>'
    +'<table class="grid" style="font-size:12.5px"><thead><tr><th>OG</th><th>Clasif.</th><th>Estado</th><th>Certificó</th><th>Cond. compra</th><th>Moneda OG</th><th style="text-align:right">TC (OG)</th><th style="text-align:right">Monto USD</th><th style="text-align:right">Monto ARS</th><th style="text-align:right">Acciones</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ==================== ASIENTO · FORMATO IMPORTACIÓN TANGO ====================
   Genera el .xlsx con las 3 hojas que Tango espera al importar asientos
   (Asientos contables / Renglones / Cotizaciones), linkeadas por "Identificador"
   (= N° de OG), MÁS una hoja "Auxiliares" al costado (agregado nuestro, porque
   el template de Tango no la trae). Todo por CÓDIGO.
   Supuestos marcados con  // SUPUESTO  → revisar con Axoft cómo ingesta los aux. */
const ASIENTO_TIPO_CN='CN';          // SUPUESTO: tipo de asiento CN - Asientos de Contabilidad
const ASIENTO_CLASE='Básico';
const ASIENTO_ESTADO_DEF='Borrador'; // se importan en Borrador para revisar en Tango
function auxDescLookup(tipoCod, cod){
  try{ if(typeof CONTA_DB!=='undefined' && CONTA_DB.auxopc && CONTA_DB.auxopc[tipoCod]){
    const f=CONTA_DB.auxopc[tipoCod].find(x=>x.cod===cod); if(f) return f.desc; } }catch(e){}
  return '';
}
function asientoTangoSheets(ogs, opByOg){
  const cabH=['Identificador','Fecha de asiento','Clase de asiento','Código de tipo de asiento','Estado','Código de moneda','Concepto','Observaciones','SOLP','OG','BONOS','Eliminar','ROW_VERSION'];
  const renH=['Identificador','Nro.','Código de cuenta','Debe','Haber','Fecha de origen','Leyenda','Importe de la unidad adicional','Cantidad','Eliminar','ROW_VERSION'];
  const cotH=['Identificador','Código de moneda','Código de tipo de cotización','Cotización','Eliminar','ROW_VERSION'];
  const auxH=['Identificador','Nro. renglón','Código tipo auxiliar','Tipo auxiliar','Código auxiliar','Descripción auxiliar','Porcentaje','Importe','Leyenda'];
  const cab=[cabH], ren=[renH], cot=[cotH], aux=[auxH];
  ogs.forEach(o=>{
    const pagosOG=(opByOg&&opByOg[o.id])||[null];               // [null] = sin pago puntual, se toma el 100% de la OG (preview desde "Ver imputación")
    const multi=pagosOG.length>1;                                 // 2+ pagos de la MISMA OG seleccionados juntos: hay que separarlos en asientos distintos
    pagosOG.forEach(pago=>{
      const pct = pago ? (pago.pct!=null && pago.pct!=='' ? +pago.pct : 100) : 100;   // % de la OG que cubre ESTE pago (viene de tesorería)
      const id = multi ? (o.numero||o.id)+'-OP'+(pago&&pago.op_numero!=null?pago.op_numero:'') : (o.numero||o.id); // SUPUESTO: si hay 2+ pagos de la misma OG en la misma exportación, se compone el Identificador con "-OP" para no duplicar filas en Tango; confirmar con Axoft si acepta identificador alfanumérico.
      const opByOgLey = pago ? {[o.id]:pago.op_numero} : opByOg;  // para que la leyenda siga mostrando "OP N - ..."
      const monCode=ogMonedaCode(o)==='USD'?'DOL':'PES';
      let fecha=o.fecha||''; try{ if(/^\d{4}-\d{2}-\d{2}/.test(o.fecha)) fecha=new Date(o.fecha+'T00:00:00'); }catch(e){}
      const concepto=_leyCaja(o,opByOgLey);   // Concepto cabecera: OP - COD PROV - OG (mismo estilo que la leyenda)
      cab.push([id, fecha, ASIENTO_CLASE, ASIENTO_TIPO_CN, ASIENTO_ESTADO_DEF, monCode, concepto, '', (o.solp!=null?o.solp:''), (o.numero||''), '', 'No', '']);
      // renglones de gasto (uno por renglón de la OG, prorrateado por el % efectivamente pagado en esta OP) → al DEBE
      let nro=0;
      (o.items||[]).forEach(it=>{
        const im=imputacion(it); const imp=itemTotal(it)*pct/100;
        nro++;
        const leyenda=_leyRenglon(o,it,opByOgLey);
        ren.push([id, nro, im.cuenta_cod||'', imp, '', fecha, leyenda, '', '', 'No', '']);
        // auxiliares de ese renglón
        if(im.eerr){ const c=EERR_COD[im.eerr]||''; aux.push([id,nro,'02','EERR',c,im.eerr,100,imp,leyenda]); }               // Aux 02 EERR (obligatorio)
        if(im.aux03){ aux.push([id,nro,'03','INSTRUCTIVO DE FABRICACION',im.aux03,auxDescLookup('3',im.aux03),100,imp,leyenda]); } // Aux 03 proyecto
        if(im.aux04){ const mods=String(im.aux04).split(' | ').filter(Boolean); const n=mods.length; const p=n===1?100:''; // SUPUESTO: si hay >1 módulo, el % lo definís vos
          const impMod = n? imp/n : imp;   // FIX: el importe del renglón se prorratea entre los módulos, no se repite entero en cada uno
          mods.forEach(m=>aux.push([id,nro,'04','CONTENEDOR/MODULO',m,auxDescLookup('4',m),p,impMod,leyenda])); }
        if(im.aux08){ aux.push([id,nro,'08','RODADOS',im.aux08,auxDescLookup('8',im.aux08),100,imp,leyenda]); }               // Aux 08 rodado
        if(im.aux05){ aux.push([id,nro,'05','MANTENIMIENTO BS DE USO',im.aux05,auxDescLookup('5',im.aux05),100,imp,leyenda]); } // Aux 05 bien de uso
        if(im.aux06){ aux.push([id,nro,'06','MUEBLES Y UTILES',im.aux06,auxDescLookup('6',im.aux06),100,imp,leyenda]); }        // Aux 06 mueble
        if(im.aux07){ aux.push([id,nro,'07','HERRAMIENTAS',im.aux07,auxDescLookup('7',im.aux07),100,imp,leyenda]); }            // Aux 07 herramienta
      });
      // contrapartida de caja (según lo efectivamente pagado en esta OP, no el total de la OG) → al HABER
      const tot=ogTotal(o)*pct/100;
      const pgReal=pago||pagosOf(o.id)[0];
      const caja = pgReal&&CAJAS[pgReal.moneda_pago] ? CAJAS[pgReal.moneda_pago] : (monCode==='DOL'?CAJAS.USD:CAJAS.ARS);
      nro++;
      ren.push([id, nro, caja.cod, '', tot, fecha, _leyCaja(o,opByOgLey), '', '', 'No', '']);
      // cotización (solo si el asiento es en dólares) → SUPUESTO: usa el TC de la OG
      if(monCode==='DOL'){ const tc=o.tc_pesos||o.tc||''; cot.push([id,'DOL','COTIZACIÓN',tc,'No','']); }
    });
  });
  return {cab,ren,cot,aux};
}
function exportAsientoTango(ogId){
  if(typeof XLSX==='undefined'){ toast('Necesitás conexión para exportar.'); return; }
  const ogs = ogId!=null ? [ogById(ogId)] : (mem.ogs||[]).filter(ogxPass);
  if(!ogs.length){ toast('No hay OG para exportar.'); return; }
  const s=asientoTangoSheets(ogs);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.cab), 'Asientos contables');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.ren), 'Renglones');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.cot), 'Cotizaciones');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.aux), 'Auxiliares');
  const suf = ogId!=null ? ('OG_'+(ogs[0].numero||'')) : new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'Asiento_Tango_'+suf+'.xlsx');
  toast('Asiento (formato Tango) generado');
}
window.asientoTangoSheets=asientoTangoSheets; window.exportAsientoTango=exportAsientoTango;

/* ===== Emisión de la Orden de Compra en PDF (para enviar al proveedor) ===== */
function exportOG_OC(ogId){
  if(typeof window.jspdf==='undefined'){ toast('No se pudo cargar el generador de PDF. Verificá tu conexión e intentá de nuevo.'); return; }
  const o=ogById(ogId); if(!o){ toast('No encontré la OG.'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  const pageW=doc.internal.pageSize.getWidth();
  const marginR=pageW-14;
  const prov=(DIC.proveedores||[]).find(p=>p.codigo===o.proveedor_cod)||{};
  const monSym=ogMonedaCode(o)==='USD'?'US$ ':'$ ';
  const money=n=>(+n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const clasifTxt=o.clasif_og?(o.clasif_og+((clasifDesc(o.clasif_og)&&clasifDesc(o.clasif_og)!==o.clasif_og)?' — '+clasifDesc(o.clasif_og):'')):'—';

  let y=16;
  doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text('ORDEN DE COMPRA', 14, y);
  doc.setFontSize(12);
  doc.text('N° '+(o.numero||''), marginR, y, {align:'right'});
  y+=9;

  doc.setFontSize(9.5);
  // ancho del campo dinámico según el largo de la etiqueta, así nunca se solapa con el valor
  const campo=(x,yy,label,val)=>{ doc.setFont(undefined,'bold'); doc.text(label,x,yy); const w=doc.getTextWidth(label); doc.setFont(undefined,'normal'); doc.text(String(val==null||val===''?'—':val),x+w+2,yy); };
  const provNombre=o.proveedor||''; const provNombreCorto=provNombre.length>30?provNombre.slice(0,30).trim()+'…':provNombre;
  const xL=14, xR=160;
  let yL=y, yR=y;
  campo(xL,yL,'Proveedor:', (o.proveedor_cod?o.proveedor_cod+' — ':'')+provNombreCorto); yL+=6;
  campo(xR,yR,'Fecha emisión:', fmtDate(o.fecha)); yR+=6;
  campo(xL,yL,'Domicilio:', (prov.domicilio||'—')+(prov.cod_postal?' (CP '+prov.cod_postal+')':'')); yL+=6;
  campo(xR,yR,'Centro de costo:', clasifTxt); yR+=6;
  campo(xL,yL,'Localidad / Provincia:', prov.provincia||'—'); yL+=6;
  campo(xR,yR,'Comprador:', o.comprador||'—'); yR+=6;
  campo(xL,yL,'Teléfono:', prov.tel||prov.tel2||'—'); yL+=6;
  campo(xR,yR,'Certificador:', o.certificador||'—'); yR+=6;
  campo(xL,yL,'Condición de compra:', o.condicion||'—'); yL+=6;
  campo(xR,yR,'SOLP:', o.solp!=null?String(o.solp):'—'); yR+=6;
  campo(xL,yL,'Cotización:', o.tc_pesos!=null?('$ '+fmtNum(o.tc_pesos,2)+' / US$'):'—'); yL+=6;
  y=Math.max(yL,yR)+4;

  const items=(o.items&&o.items.length)?o.items:[{cod_art:'',articulo:o.objeto||'(sin renglones)',hito:'',cant:1,um:'',precio_unit:o.monto_total||0,bonif_pct:0,fecha_entrega:'',deposito:''}];
  const body=items.map(it=>{
    const dep=it.deposito?(it.deposito+((depositoDesc(it.deposito)&&depositoDesc(it.deposito)!==it.deposito)?' - '+depositoDesc(it.deposito):'')):'—';
    return [
      it.cod_art||'—',
      (it.articulo||'')+(it.hito?('\n'+it.hito):''),
      fmtNum(it.cant,2),
      it.um||'—',
      monSym+money(it.precio_unit),
      it.bonif_pct?(fmtNum(it.bonif_pct,2)+'%'):'—',
      it.fecha_entrega?fmtDate(it.fecha_entrega):'—',
      dep,
      monSym+money(itemTotal(it)),
    ];
  });
  doc.autoTable({
    startY:y,
    margin:{left:14,right:14},
    head:[['Cód.','Descripción','Cant.','U.M.','P. Unit.','Bonif.','Entrega','Depósito','Importe']],
    body,
    styles:{fontSize:8, cellPadding:2.2, valign:'middle'},
    headStyles:{fillColor:[95,122,78], textColor:255},
    columnStyles:{1:{cellWidth:78}, 8:{halign:'right'}, 4:{halign:'right'}},
  });

  let yy=doc.lastAutoTable.finalY+8;
  const subtotal=items.reduce((a,it)=>a+itemTotal(it),0);
  const total=ogTotal(o);
  doc.setFontSize(10);
  doc.text('Subtotal: '+monSym+money(subtotal), marginR, yy, {align:'right'});
  if(+o.bonif_pct){ yy+=6; doc.text('Bonificación OG ('+fmtNum(o.bonif_pct,2)+'%): -'+monSym+money(subtotal-total), marginR, yy, {align:'right'}); }
  yy+=8; doc.setFont(undefined,'bold'); doc.text('TOTAL: '+monSym+money(total), marginR, yy, {align:'right'}); doc.setFont(undefined,'normal');

  yy+=22;
  const pageH=doc.internal.pageSize.getHeight();
  if(yy>pageH-30) yy=pageH-30;
  doc.setFontSize(9.5);
  doc.text('Recibí conforme:', 14, yy);
  doc.line(14, yy+16, 90, yy+16);
  doc.text('Firma y sello', 14, yy+20);

  if((o.alcance||'').trim()){
    let ay=yy+30;
    if(ay>pageH-16){ doc.addPage({ orientation:'landscape' }); ay=16; }
    doc.setFont(undefined,'bold'); doc.text('Alcance del trabajo:', 14, ay);
    doc.setFont(undefined,'normal');
    const lines=doc.splitTextToSize(o.alcance.trim(), pageW-28);
    doc.text(lines, 14, ay+5);
  }

  doc.save('OC_'+(o.numero||'sin_numero')+'.pdf');
  toast('OC generada');
}
window.exportOG_OC=exportOG_OC;

function openPago(ogId){
  const o=ogById(ogId); const monOG=ogMonedaCode(o);
  const pendPct=ogPendPagoPct(o); const pendMonto=ogPendPagoMonto(o); const tot=ogTotal(o); const simbOG=monOG==='USD'?'US$ ':'$ ';

function pgCalc(){
  const o=window._pgOG; if(!o) return; const monOG=ogMonedaCode(o);
  const montoOG=+document.getElementById('pg_imp').value||0;   // importe en moneda de la OG
  const monPago=document.getElementById('pg_moneda').value;
  const tc=+document.getElementById('pg_tc').value||0;
  let importe=montoOG, nota='';
  const conv = monOG!==monPago;
  document.getElementById('pg_tcField').style.display = '';   // TC siempre visible
  if(conv){
    if(monOG==='USD'&&monPago==='ARS'){ importe=montoOG*tc; nota='US$ '+montoOG.toLocaleString('es-AR',{maximumFractionDigits:2})+' × '+tc+' = '; }
    else if(monOG==='ARS'&&monPago==='USD'){ importe= tc? montoOG/tc : 0; nota='$ '+montoOG.toLocaleString('es-AR')+' ÷ '+tc+' = '; }
  }
  const caja=CAJAS[monPago]; const simb=monPago==='USD'?'US$ ':'$ ';
  const pct=ogTotal(o)? montoOG/ogTotal(o)*100 : 0;
  document.getElementById('pg_result').innerHTML='Equivale al <strong>'+pct.toFixed(1).replace('.0','')+'%</strong> de la OG.<br>Sale de <strong>'+caja.nombre+'</strong> ('+caja.cod+')<br>Importe: '+nota+'<strong>'+simb+importe.toLocaleString('es-AR',{maximumFractionDigits:2})+'</strong>';
  window._pgImporte=importe;
}
window.pgCalc=pgCalc;
async function savePago(ogId){
  if(!canPago()){ toast('Solo el tesorero puede registrar pagos.'); return; }
  const o=ogById(ogId); const monOG=ogMonedaCode(o);
  let montoOG=+document.getElementById('pg_imp').value||0;    // importe en moneda de la OG
  const pendMonto=ogPendPagoMonto(o);
  if(montoOG<=0){ toast('Ingresá un importe mayor a 0'); return; }
  if(montoOG>pendMonto+0.01){ toast('El importe supera lo pendiente ('+(monOG==='USD'?'US$ ':'$ ')+pendMonto.toLocaleString('es-AR',{maximumFractionDigits:2})+')'); return; }
  if(montoOG>pendMonto) montoOG=pendMonto;   // ajuste fino por centavos
  const pct=ogTotal(o)? montoOG/ogTotal(o)*100 : 0;
  const monPago=document.getElementById('pg_moneda').value;
  const tc=+document.getElementById('pg_tc').value||0;
  if((monOG==='USD'||monPago==='USD') && !tc){ toast('Cargá el tipo de cambio'); return; }
  let importe=montoOG;
  if(monOG!==monPago){ if(monOG==='USD'&&monPago==='ARS') importe=montoOG*tc; else if(monOG==='ARS'&&monPago==='USD') importe = tc? montoOG/tc : 0; }
  const pago={ og_id:o.id, numero:o.numero,
    fecha:document.getElementById('pg_fecha').value, pct,
    moneda_og:monOG, moneda_pago:monPago, tc:(tc||null),
    medio:document.getElementById('pg_medio').value, caja_cod:CAJAS[monPago].cod,
    sin_caja: COND_SIN_CAJA.includes(o.condicion),
    importe_pago:importe, observaciones:document.getElementById('pg_obs').value };
  try{
    if(DEMO_MODE){ pago.id=Math.max(0,...(mem.pagos||[]).map(p=>+p.id||0))+1; pago.op_numero=Math.max(0,...(mem.pagos||[]).map(p=>+p.op_numero||0))+1; mem.pagos=mem.pagos||[]; mem.pagos.push(pago); }
    else { pago.registrado_por=(AUTH_USER&&AUTH_USER.email)||''; await sbFetch('/pagos',{method:'POST',body:JSON.stringify(pago)}); await reloadDB(); }
  }catch(e){
    toast('No se pudo registrar el pago: '+(e && e.message ? e.message : e));
    return;
  }
  closeModal(); toast('Pago registrado'); renderTesoreria();
}
window.savePago=savePago;

function arqueoView(){
  const card=(mon)=>{ const c=CAJAS[mon]; const cc=CAJAS_CONF[mon]; const ini=(mem.caja&&mem.caja[mon+'_ini'])||0;
    const pagos=cajaMovs(mon); const ings=cajaIngresos(mon);
    const egresos=pagos.reduce((a,p)=>a+(+p.importe_pago||0),0);
    const repuesto=ings.reduce((a,i)=>a+(+i.importe||0),0);
    const saldo=ini+repuesto-egresos;
    const simb=mon==='USD'?'US$ ':'$ '; const fmt=v=>simb+(+v||0).toLocaleString('es-AR',{maximumFractionDigits:2});
    const movs=[].concat(
      ings.map(i=>({tipo:'ing', fecha:i.fecha, det:'Reposición ← '+cc.cod, medio:i.observaciones||'', imp:+i.importe||0, id:i.id})),
      pagos.map(p=>({tipo:'pag', fecha:p.fecha, det:'OG '+(p.numero||''), medio:p.medio||'', imp:-(+p.importe_pago||0), id:p.id}))
    ).sort((a,b)=>(a.fecha<b.fecha?1:-1));
    const rows=movs.length?movs.map(m=>{
      const pos=m.imp>=0; const col=pos?'#1a7a3a':'var(--bad)';

        ? '<button class="btn ghost sm" title="Asiento de transferencia (Tango)" onclick="exportAsientoReposicion('+m.id+')">Asiento</button>'+((canPago()&&m.id!=null)?' <button class="iconbtn del" title="Eliminar reposición" onclick="askDelIngreso('+m.id+')">'+ICO.del+'</button>':'')
        : ((canPago()&&m.id!=null)?'<button class="iconbtn del" title="Eliminar pago" onclick="askDelPago('+m.id+')">'+ICO.del+'</button>':'');
      return '<tr><td>'+esc(fmtDate(m.fecha))+'</td><td>'+esc(m.det)+'</td><td>'+esc(m.medio)+'</td><td style="text-align:right;color:'+col+'">'+(pos?'+':'-')+fmt(Math.abs(m.imp))+'</td><td style="text-align:right">'+acc+'</td></tr>';
    }).join(''):'<tr><td colspan="5" style="color:var(--muted)">Sin movimientos</td></tr>';
    const btnIng = canPago()? '<button class="btn sm" onclick="openIngresoCaja(\''+mon+'\')">+ Ingresar fondos</button>' : '';

      +'<div><div style="font-size:11.5px;color:var(--muted)">Reposiciones</div><div style="font-size:18px;font-weight:700;color:#1a7a3a">+'+fmt(repuesto)+'</div></div>'
      +'<div><div style="font-size:11.5px;color:var(--muted)">Egresos (pagos)</div><div style="font-size:18px;font-weight:700;color:var(--bad)">-'+fmt(egresos)+'</div></div>'
      +'<div><div style="font-size:11.5px;color:var(--muted)">Saldo disponible</div><div style="font-size:18px;font-weight:700">'+fmt(saldo)+'</div></div></div>'
      +'<table class="grid"><thead><tr><th>Fecha</th><th>Detalle</th><th>Medio / motivo</th><th style="text-align:right">Importe</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  };
  return '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Saldo disponible de cada caja PROY = saldo inicial + reposiciones − pagos. Las reposiciones se cargan desde la caja confidencial y generan su asiento de transferencia para Tango.</div>'+card('ARS')+card('USD');

async function guardarIngresoCaja(){
  if(!canPago()){ toast('Sin permiso.'); return; }
  const fecha=((document.getElementById('ing_fecha')||{}).value)||'';
  const mon=((document.getElementById('ing_moneda')||{}).value)||'ARS';
  const importe=+((document.getElementById('ing_importe')||{}).value)||0;
  const obs=(((document.getElementById('ing_obs')||{}).value)||'').trim();
  const msg=document.getElementById('ingMsg');
  if(!fecha){ if(msg)msg.textContent='Elegí la fecha.'; return; }
  if(!(importe>0)){ if(msg)msg.textContent='El importe tiene que ser mayor a 0.'; return; }
  const rec={fecha, moneda:mon, importe, origen_cod:CAJAS_CONF[mon].cod, destino_cod:CAJAS[mon].cod, observaciones:obs};
  try{
    if(DEMO_MODE){ rec.id=Math.max(0,...(mem.ingresos||[]).map(i=>+i.id||0))+1; mem.ingresos=mem.ingresos||[]; mem.ingresos.push(rec); }
    else { rec.creado_por=(AUTH_USER&&AUTH_USER.email)||''; await sbFetch('/caja_ingresos',{method:'POST',body:JSON.stringify(rec)}); await reloadDB(); }
    closeModal(); toast('Ingreso registrado: '+(mon==='USD'?'US$ ':'$ ')+importe.toLocaleString('es-AR'));
    renderTesoreria();
  }catch(e){
    const em=String(e.message||e);
    if(/caja_ingresos/i.test(em)||/relation|does not exist|schema cache|PGRST/i.test(em)){ if(msg)msg.textContent='Falta crear la tabla caja_ingresos en Supabase (te paso el SQL).'; }
    else if(msg){ msg.textContent='Error: '+em; }
  }
}

function asientoReposicionSheets(ing){
  const cabH=['Identificador','Fecha de asiento','Clase de asiento','Código de tipo de asiento','Estado','Código de moneda','Concepto','Observaciones','SOLP','OG','BONOS','Eliminar','ROW_VERSION'];
  const renH=['Identificador','Nro.','Código de cuenta','Debe','Haber','Fecha de origen','Leyenda','Importe de la unidad adicional','Cantidad','Eliminar','ROW_VERSION'];
  const cotH=['Identificador','Código de moneda','Código de tipo de cotización','Cotización','Eliminar','ROW_VERSION'];
  const auxH=['Identificador','Nro. renglón','Código tipo auxiliar','Tipo auxiliar','Código auxiliar','Descripción auxiliar','Porcentaje','Importe','Leyenda'];
  const id='REP-'+(ing.id||'');
  const mon=ing.moneda==='USD'?'USD':'ARS'; const monCode=mon==='USD'?'DOL':'PES';
  let fecha=ing.fecha||''; try{ if(/^\d{4}-\d{2}-\d{2}/.test(ing.fecha)) fecha=new Date(ing.fecha+'T00:00:00'); }catch(e){}
  const dest=CAJAS[mon], orig=CAJAS_CONF[mon]; const imp=+ing.importe||0;
  const ley=('Reposición '+dest.nombre+' desde '+orig.nombre+(ing.observaciones?(' - '+ing.observaciones):'')).slice(0,60);
  const cab=[cabH,[id,fecha,ASIENTO_CLASE,ASIENTO_TIPO_CN,ASIENTO_ESTADO_DEF,monCode,'Reposición de fondos a caja PROY','','','','','No','']];
  const ren=[renH,
    [id,1,dest.cod,imp,'',fecha,ley,'','','No',''],   // DEBE: entra a caja PROY
    [id,2,orig.cod,'',imp,fecha,ley,'','','No','']    // HABER: sale de la caja confidencial
  ];
  return {cab,ren,cot:[cotH],aux:[auxH]};
}
function exportAsientoReposicion(id){
  if(typeof XLSX==='undefined'){ toast('Necesitás conexión para exportar.'); return; }
  const ing=(mem.ingresos||[]).find(i=>String(i.id)===String(id));
  if(!ing){ toast('No encontré la reposición.'); return; }
  const s=asientoReposicionSheets(ing); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.cab), 'Asientos contables');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.ren), 'Renglones');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.cot), 'Cotizaciones');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.aux), 'Auxiliares');
  XLSX.writeFile(wb, 'Asiento_Reposicion_'+id+'.xlsx'); toast('Asiento de transferencia generado');
}

async function saveOG(id){
  // El Diccionario es la única fuente de verdad: proveedor y artículos tienen que existir ahí
  // (cargados a mano en Diccionario, o sincronizados desde Tango) antes de poder usarse en una OG.
  const provRaw=(document.getElementById('og_proveedor').value||'').trim();
  const vv=resolveProv(provRaw);
  if(provRaw && !vv){
    alert('El proveedor "'+provRaw+'" no existe en el Diccionario.\n\nAgregalo en Diccionario → Proveedores, o sincronizalo desde Tango, y después elegilo de la lista antes de guardar la OG.');
    return;
  }
  const faltantes=[];
  OG_ITEMS.forEach((it,i)=>{
    if(it._locked) return; // ya certificado: no se revalida retroactivamente
    const codRaw=(it.cod_art||'').trim(), artRaw=(it.articulo||'').trim();
    if(!codRaw && !artRaw) return; // renglón vacío, no cuenta
    const art=(typeof DIC!=='undefined'?DIC.articulos:[]).find(x=>x.codigo===codRaw);
    if(!art){ faltantes.push('Renglón '+(i+1)+': "'+(codRaw||artRaw)+'"'); }
    else { it.cod_art=art.codigo; it.articulo=art.descripcion; } // la descripción SIEMPRE sale del Diccionario
  });
  if(faltantes.length){
    alert('Estos renglones no tienen un artículo del Diccionario:\n\n'+faltantes.join('\n')+'\n\nAgregalos en Diccionario → Artículos, o sincronizalos desde Tango, y elegilos de la lista antes de guardar.');
    return;
  }
  const items=OG_ITEMS.filter(it=>(it.cod_art||'').trim()||(it.articulo||'').trim()||it.precio_unit)
    .map(it=>({cod_art:it.cod_art||'',articulo:it.articulo||'',hito:it.hito||'',cert_modo:(it.cert_modo==='unid'?'unid':'pct'),centro_costos:it.centro_costos||'',modulos:(it.modulos||[]).slice(0,5),cant:+it.cant||0,um:it.um||'UNI',precio_unit:+it.precio_unit||0,fecha_entrega:it.fecha_entrega||'',deposito:it.deposito||'',bonif_pct:+it.bonif_pct||0,imp:it.imp||{}}));
  const gv=id=>document.getElementById(id).value;
  const obj={ fecha:gv('og_fecha'),
    proveedor_cod: vv?vv.codigo:'', proveedor: vv?(vv.razon||vv.comercial):'',
    clasif_og:(document.getElementById('og_clasif').value||'').split(' — ')[0].trim(),
    condicion:gv('og_condicion'), tipo_contratacion:gv('og_condicion'), moneda:gv('og_moneda'),
    tc_pesos:(gv('og_tc')===''?null:+gv('og_tc')),
    anticipo_pct:(gv('og_condicion')==='CON ANTICIPO' && document.getElementById('og_antpct') && document.getElementById('og_antpct').value!=='')?+document.getElementById('og_antpct').value:null,
    anticipo_metodo:(gv('og_condicion')==='CON ANTICIPO' && document.getElementById('og_antmet'))?document.getElementById('og_antmet').value:null,
    comprador:gv('og_comprador'), certificador:gv('og_certificador'),
    solp:(gv('og_solp')===''?null:+gv('og_solp')), compra_urgente:gv('og_urgente'),
    bonif_pct:(gv('og_bonif_pct')===''?0:+gv('og_bonif_pct')),
    costeo:gv('og_costeo'), estructura:gv('og_estructura'), postventa:gv('og_postventa'),
    desvio:gv('og_desvio'), desvio_txt:gv('og_desvio_txt'), alcance:gv('og_alcance'), observaciones:gv('og_obs'),
    items };
  obj.monto_total = items.length ? items.reduce((a,it)=>a+(it.cant*it.precio_unit),0) : (gv('og_monto')===''?null:+gv('og_monto'));
  const isNew=(id==null||id==='null');
  try{
    if(DEMO_MODE){
      if(isNew){ obj.id=Math.max(0,...mem.ogs.map(r=>+r.id||0))+1; obj.numero=String(Math.max(1999,...(mem.ogs||[]).map(x=>+x.numero||0))+1); mem.ogs.unshift(obj); }
      else { const r=ogById(id); if(r) Object.assign(r,obj); }   // no cambia el N°
    } else {
      if(isNew) await sbFetch('/ogs',{method:'POST',body:JSON.stringify(obj)});   // Supabase asigna el N° (correlativo)
      else await sbFetch('/ogs?id=eq.'+id,{method:'PATCH',body:JSON.stringify(obj)});
      await reloadDB();
    }
  }catch(e){
    toast('No se pudo guardar la OG: '+(e && e.message ? e.message : e));
    return;
  }
  closeModal(); toast('Guardado'); renderCompras();
}

async function saveCert(ogId, id){
  if(!canCert()){ toast('No tenés permiso para cargar/editar certificados.'); return; }
  const editando=(id!=null&&id!=='null');
  if(editando && pagosOf(ogId).length>0){ toast('La OG tiene pagos: no se puede editar el certificado. El tesorero debe eliminar el pago primero.'); return; }
  const o=ogById(ogId); const hasItems = o && o.items && o.items.length;
  const obj={ og_id:ogId, numero:document.getElementById('ct_num').value, fecha:document.getElementById('ct_fecha').value,
    observaciones:document.getElementById('ct_obs').value };
  if(id==null||id==='null') obj.numero = nextCertNum(o);   // recalcula al guardar (evita colisiones)
  if(hasItems){ const av={}; o.items.forEach((it,idx)=>{ const el=document.getElementById('ctav_'+idx); if(el && el.value!==''){ let v=+el.value; if(it.cert_modo==='unid'){ const c=+it.cant||0; v = c ? (v/c*100) : 0; } av[idx]=v; } }); obj.avances=av; obj.pct=null; }
  else { const pct=document.getElementById('ct_pct').value; obj.pct=(pct===''?0:+pct); }
  // Validación: el acumulado no puede superar el 100%
  const stored = (id!=null&&id!=='null') ? certsOf(ogId).find(x=>String(x.id)===String(id)) : null;
  const EPS=0.01;
  if(hasItems){
    for(let idx=0; idx<o.items.length; idx++){
      const nv=+((obj.avances||{})[idx])||0;
      const prev=+(((stored||{}).avances||{})[idx])||0;
      const nuevo=itemAcumPct(o,idx)-prev+nv;
      if(nuevo>100+EPS){ toast('El ítem “'+(o.items[idx].descripcion||('#'+(idx+1)))+'” superaría el 100% (quedaría '+nuevo.toFixed(1).replace('.0','')+'%)'); return; }
    }
  }else{
    const prev=+(stored||{}).pct||0;
    const nuevo=ogAcumPct(ogId)-prev+(+obj.pct||0);
    if(nuevo>100+EPS){ toast('Supera el 100% de la OG (quedaría '+nuevo.toFixed(1).replace('.0','')+'%). No se puede certificar más que el total.'); return; }
  }

function delCert(id, ogId){

    '<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="confirmDelCert('+id+','+ogId+')">Eliminar</button>');
}
window.delCert=delCert;
async function confirmDelCert(id, ogId){
  if(pagosOf(ogId).length>0){ toast('La OG tiene pagos; no se puede eliminar el certificado.'); return; }

}

let SYNC_RESULT=null;
function openSyncTango(){
  if(!ROLE.admin){ toast('Solo un administrador puede sincronizar artículos.'); return; }
  SYNC_RESULT=null;
  const body='<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Subí los dos exports de Tango (maestro de artículos y parametrización contable). La app los compara contra los artículos cargados e informa qué falta crear, qué cambió y qué está sin parametrizar. <strong>No escribe nada hasta que toques Aplicar.</strong></div>'
    +'<div class="frow c2">'
    +'<div class="field"><label>Maestro de artículos (.xlsx) *</label><input id="sync_maestro" type="file" accept=".xlsx,.xls"></div>'
    +'<div class="field"><label>Parametrización contable (.xlsx) *</label><input id="sync_param" type="file" accept=".xlsx,.xls"></div>'
    +'</div>'
    +'<div id="syncMsg" style="font-size:12px;color:var(--muted);margin-top:6px;min-height:16px"></div>'
    +'<div id="syncReport" style="margin-top:12px"></div>';
  const foot='<button class="btn ghost" onclick="closeModal()">Cerrar</button>'
    +'<button class="btn" id="syncAnalizarBtn" onclick="syncAnalizar()">Analizar</button>';
  openModal('Sincronizar artículos con Tango', body, foot, 'xwide');
}
window.openSyncTango=openSyncTango;

function _syncNorm(s){ return String(s==null?'':s).trim(); }
function _syncFold(s){ return _syncNorm(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function _syncIdx(hdr, ...cands){ const H=hdr.map(_syncFold); for(const c of cands){ const i=H.indexOf(_syncFold(c)); if(i>=0) return i; } return -1; }
function _syncReadWb(file){
  return new Promise((resolve,reject)=>{
    if(!file){ reject(new Error('Falta un archivo')); return; }
    const fr=new FileReader();
    fr.onload=e=>{ try{ resolve(XLSX.read(new Uint8Array(e.target.result),{type:'array'})); }catch(err){ reject(new Error('No pude leer '+file.name+': '+(err.message||err))); } };
    fr.onerror=()=>reject(new Error('No se pudo abrir '+file.name));
    fr.readAsArrayBuffer(file);
  });
}
function _syncSheetRows(wb, test){
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});
    if(rows.length && test(rows[0].map(h=>_syncNorm(h)))) return rows;
  }
  return null;
}
function _syncSection(title,n,inner,openIt){
  const head='<summary style="cursor:pointer;font-weight:600;font-size:13.5px;padding:7px 2px">'+esc(title)+' ('+n+')</summary>';
  const cont = n ? ('<div class="dic-scroll" style="max-height:36vh">'+inner+'</div>') : '<div style="font-size:12px;color:var(--muted);padding:2px 4px 8px">Ninguno.</div>';
  return '<details'+((openIt&&n)?' open':'')+' style="margin-bottom:8px;border:1px solid var(--line-strong);border-radius:9px;padding:2px 10px;background:#fff">'+head+cont+'</details>';
}
function _syncMore(total,cap){ return total>cap?'<div style="font-size:11.5px;color:var(--muted);padding:6px 12px">Mostrando '+cap+' de '+total+'. El resto se aplica igual.</div>':''; }

async function syncAnalizar(){
  const fm=(document.getElementById('sync_maestro').files||[])[0];
  const fp=(document.getElementById('sync_param').files||[])[0];
  const msg=document.getElementById('syncMsg');
  const setErr=t=>{ msg.style.color='#b3261e'; msg.textContent=t; };
  if(!fm||!fp){ setErr('Necesito los dos archivos (maestro y parametrización).'); return; }
  msg.style.color='var(--muted)'; msg.textContent='Leyendo archivos…';
  try{
    const [wbM,wbP]=await Promise.all([_syncReadWb(fm),_syncReadWb(fp)]);
    const rm=_syncSheetRows(wbM, h=>_syncIdx(h,'Código')>=0 && _syncIdx(h,'Descripción')>=0);
    if(!rm) throw new Error('En el maestro no encontré una hoja con columnas "Código" y "Descripción".');
    const hM=rm[0], iCod=_syncIdx(hM,'Código'), iDesc=_syncIdx(hM,'Descripción'), iAdic=_syncIdx(hM,'Descripción adicional'), iSin=_syncIdx(hM,'Sinónimo');
    const rp=_syncSheetRows(wbP, h=>_syncIdx(h,'Código de artículo')>=0 && _syncIdx(h,'Código de cuenta contable de compras')>=0);
    if(!rp) throw new Error('En la parametrización no encontré "Código de artículo" y "Código de cuenta contable de compras".');
    const hP=rp[0], pCod=_syncIdx(hP,'Código de artículo'), pCta=_syncIdx(hP,'Código de cuenta contable de compras'), pCtaD=_syncIdx(hP,'Descripción de cuenta contable de compras');
    const param={};
    for(let i=1;i<rp.length;i++){ const c=_syncNorm(rp[i][pCod]); if(!c) continue; param[c]={cuenta_cod:_syncNorm(rp[i][pCta]), cuenta:pCtaD>=0?_syncNorm(rp[i][pCtaD]):''}; }
    const tango={};
    for(let i=1;i<rm.length;i++){
      const c=_syncNorm(rm[i][iCod]); if(!c) continue;
      const p=param[c]||{cuenta_cod:'',cuenta:''};
      tango[c]={ codigo:c, descripcion:_syncNorm(rm[i][iDesc]), desc_adicional:iAdic>=0?_syncNorm(rm[i][iAdic]):'', sinonimo:iSin>=0?_syncNorm(rm[i][iSin]):'', cuenta_cod:p.cuenta_cod, cuenta:p.cuenta };
    }
    const huerfanas=Object.keys(param).filter(c=>!tango[c]);
    const app={}; DIC.articulos.forEach(a=>{ app[_syncNorm(a.codigo)]=a; });
    const nuevos=[], modificados=[], sinParam=[];
    Object.keys(tango).sort().forEach(c=>{
      const t=tango[c], a=app[c];
      if(!t.cuenta_cod) sinParam.push(t);
      if(!a){ nuevos.push(t); return; }
      const diffs=[];
      if(t.descripcion && _syncNorm(a.descripcion)!==t.descripcion) diffs.push(['Descripción', a.descripcion, t.descripcion]);
      if(t.desc_adicional && _syncNorm(a.desc_adicional)!==t.desc_adicional) diffs.push(['Desc. adicional', a.desc_adicional, t.desc_adicional]);
      if(t.cuenta_cod && _syncNorm(a.cuenta_cod)!==t.cuenta_cod) diffs.push(['Cuenta', (a.cuenta_cod||'—')+' '+(a.cuenta||''), t.cuenta_cod+' '+t.cuenta]);
      if(diffs.length) modificados.push({t, diffs});
    });
    const enAppNoTango=Object.keys(app).filter(c=>!tango[c] && /^GC/i.test(c)).map(c=>app[c]); // export es GC-only: los de venta (PV*/V*) no cuentan como baja
    SYNC_RESULT={nuevos, modificados, sinParam, huerfanas, enAppNoTango, totTango:Object.keys(tango).length};
    msg.style.color='var(--muted)';
    msg.textContent='Tango: '+SYNC_RESULT.totTango+' artículos · App: '+DIC.articulos.length+' artículos.';
    renderSyncReport();
  }catch(e){ setErr('Error: '+(e.message||e)); }
}
window.syncAnalizar=syncAnalizar;

     + '</tbody></table>'+_syncMore(R.modificados.length,400), true);
  h+=_syncSection('Sin parametrizar contablemente — falta cargarles la cuenta en Tango', R.sinParam.length,
     '<table class="grid"><thead><tr><th>Código</th><th>Descripción</th></tr></thead><tbody>'
     + R.sinParam.slice(0,400).map(t=>'<tr><td><strong>'+esc(t.codigo)+'</strong></td><td>'+esc(t.descripcion)+'</td></tr>').join('')
     + '</tbody></table>'+_syncMore(R.sinParam.length,400), true);
  h+=_syncSection('Artículos GC en la app y no en el export — posibles bajas, revisá (solo comprables GC). No se borra nada.', R.enAppNoTango.length,
     '<table class="grid"><thead><tr><th>Código</th><th>Descripción</th></tr></thead><tbody>'
     + R.enAppNoTango.slice(0,400).map(a=>'<tr><td><strong>'+esc(a.codigo)+'</strong></td><td>'+esc(a.descripcion||'—')+'</td></tr>').join('')
     + '</tbody></table>'+_syncMore(R.enAppNoTango.length,400), false);
  if(R.huerfanas.length){
    h+=_syncSection('Parametrización huérfana — cuenta apunta a un código que no está en el maestro', R.huerfanas.length,
      '<div style="font-size:12px;padding:8px 12px;line-height:1.7">'+R.huerfanas.slice(0,300).map(esc).join(' · ')+'</div>', false);

}

async function syncAplicar(){
  if(!ROLE.admin){ toast('Solo un administrador puede aplicar cambios.'); return; }
  if(!SYNC_RESULT) return;
  const {nuevos, modificados}=SYNC_RESULT;
  if(!nuevos.length && !modificados.length){ toast('No hay cambios para aplicar.'); return; }
  if(!confirm('Se van a CREAR '+nuevos.length+' artículo(s) y ACTUALIZAR '+modificados.length+' en Supabase.'+(DEMO_MODE?' (Estás en modo demo: solo cambia en memoria.)':'')+'\n¿Confirmás?')) return;
  const btn=document.getElementById('syncAplicarBtn'); if(btn){ btn.disabled=true; btn.textContent='Aplicando…'; }
  try{
    if(nuevos.length){
      const payload=nuevos.map(t=>({codigo:t.codigo, descripcion:t.descripcion, desc_adicional:t.desc_adicional, sinonimo:t.sinonimo, cuenta_cod:t.cuenta_cod, cuenta:t.cuenta}));
      if(!DEMO_MODE){ for(let i=0;i<payload.length;i+=500){ await sbFetch('/articulos',{method:'POST', body:JSON.stringify(payload.slice(i,i+500))}); } }
      payload.forEach(p=>{ if(!DIC.articulos.some(a=>_syncNorm(a.codigo)===p.codigo)) DIC.articulos.push({codigo:p.codigo, descripcion:p.descripcion, desc_adicional:p.desc_adicional, sinonimo:p.sinonimo, cuenta_cod:p.cuenta_cod, cuenta:p.cuenta}); });
    }
    let okMod=0;
    for(const m of modificados){
      const t=m.t;
      const upd={descripcion:t.descripcion, desc_adicional:t.desc_adicional};
      if(t.cuenta_cod){ upd.cuenta_cod=t.cuenta_cod; upd.cuenta=t.cuenta; } // nunca borra una cuenta existente con un vacío
      if(!DEMO_MODE){ await sbFetch('/articulos?codigo=eq.'+encodeURIComponent(t.codigo),{method:'PATCH', body:JSON.stringify(upd)}); }
      const a=DIC.articulos.find(x=>_syncNorm(x.codigo)===t.codigo);

          iAct=_syncIdx(H,'Actividad'), iIva=_syncIdx(H,'Código de categoría IVA','Codigo de categoria IVA'),
          iDom=_syncIdx(H,'Domicilio'), iCP=_syncIdx(H,'Código postal','Codigo postal'),

          iMov=_syncIdx(H,'Móvil','Movil'), iEmail=_syncIdx(H,'Correo electrónico','Correo electronico','Email'), iWeb=_syncIdx(H,'Página web','Pagina web');
    const tango={};
    for(let i=1;i<rows.length;i++){
      const c=_syncNorm(rows[i][iCod]); if(!c) continue;
      tango[c]={ codigo:c,
        razon:_syncNorm(rows[i][iRazon]),
        comercial:iCom>=0?_syncNorm(rows[i][iCom]):'',
        cuit:iCuit>=0?_syncNorm(rows[i][iCuit]):'',
        provincia_cod:iProvC>=0?_syncNorm(rows[i][iProvC]):'',
        provincia:iProvD>=0?_syncNorm(rows[i][iProvD]):'',
        actividad:iAct>=0?_syncNorm(rows[i][iAct]):'',
        iva:iIva>=0?_syncNorm(rows[i][iIva]):'',
        domicilio:iDom>=0?_syncNorm(rows[i][iDom]):'',
        cod_postal:iCP>=0?_syncNorm(rows[i][iCP]):'',
        tel:iTel>=0?_syncNorm(rows[i][iTel]):'',
        tel2:iTel2>=0?_syncNorm(rows[i][iTel2]):'',
        movil:iMov>=0?_syncNorm(rows[i][iMov]):'',
        email:iEmail>=0?_syncNorm(rows[i][iEmail]):'',
        web:iWeb>=0?_syncNorm(rows[i][iWeb]):'' };
    }
    const app={}; DIC.proveedores.forEach(p=>{ app[_syncNorm(p.codigo)]=p; });
    const nuevos=[], modificados=[];
    const CAMPOS=[['razon','Razón social'],['comercial','Nombre comercial'],['cuit','CUIT'],['domicilio','Domicilio'],['cod_postal','Cód. postal'],['provincia_cod','Cód. provincia'],['provincia','Provincia'],['actividad','Actividad'],['iva','Cat. IVA'],['tel','Teléfono'],['tel2','Teléfono 2'],['movil','Móvil'],['email','Email'],['web','Web']];
    Object.keys(tango).sort().forEach(c=>{
      const t=tango[c], a=app[c];

      const diffs=[];

      if(diffs.length) modificados.push({t, diffs});
    });

async function syncProvAplicar(){
  if(!ROLE.admin){ toast('Solo un administrador puede aplicar cambios.'); return; }
  if(!SYNC_PROV) return;
  const {nuevos, modificados}=SYNC_PROV;
  if(!nuevos.length && !modificados.length){ toast('No hay cambios para aplicar.'); return; }
  if(!confirm('Se van a CREAR '+nuevos.length+' proveedor(es) y ACTUALIZAR '+modificados.length+' en Supabase.'+(DEMO_MODE?' (Estás en modo demo: solo cambia en memoria.)':'')+'\n¿Confirmás?')) return;
  const btn=document.getElementById('syncpAplicarBtn'); if(btn){ btn.disabled=true; btn.textContent='Aplicando…'; }
  const CAMPOS=['razon','comercial','cuit','domicilio','cod_postal','provincia_cod','provincia','actividad','iva','tel','tel2','movil','email','web'];
  try{
    if(nuevos.length){
      const payload=nuevos.map(t=>({codigo:t.codigo, razon:t.razon, comercial:t.comercial||t.razon, cuit:t.cuit, provincia_cod:t.provincia_cod, provincia:t.provincia, actividad:t.actividad, iva:t.iva, domicilio:t.domicilio, cod_postal:t.cod_postal, tel:t.tel, tel2:t.tel2, movil:t.movil, email:t.email, web:t.web}));
      if(!DEMO_MODE){
        try{ for(let i=0;i<payload.length;i+=500){ await sbFetch('/proveedores',{method:'POST', body:JSON.stringify(payload.slice(i,i+500))}); } }
        catch(colErr){ /* columnas nuevas (domicilio/cod_postal/tel2) aún no creadas en Supabase: reintento sin ellas */
          const payloadClasico=payload.map(({domicilio,cod_postal,tel2,...rest})=>rest);
          for(let i=0;i<payloadClasico.length;i+=500){ await sbFetch('/proveedores',{method:'POST', body:JSON.stringify(payloadClasico.slice(i,i+500))}); }
        }
      }
      payload.forEach(p=>{ if(!DIC.proveedores.some(x=>_syncNorm(x.codigo)===p.codigo)) DIC.proveedores.push({codigo:p.codigo, razon:p.razon, comercial:p.comercial||p.razon, cuit:p.cuit, tel:p.tel||'', movil:p.movil||'', email:p.email||'', web:p.web||'', provincia_cod:p.provincia_cod, provincia:p.provincia, actividad:p.actividad, iva:p.iva, domicilio:p.domicilio||'', cod_postal:p.cod_postal||'', tel2:p.tel2||''}); });
    }
    let okMod=0;
    for(const m of modificados){
      const t=m.t;
      const upd={}; // solo campos con valor: un vacío de Tango nunca pisa lo existente
      CAMPOS.forEach(k=>{ if(t[k]) upd[k]=t[k]; });
      if(Object.keys(upd).length){
        if(!DEMO_MODE){
          try{ await sbFetch('/proveedores?codigo=eq.'+encodeURIComponent(t.codigo),{method:'PATCH', body:JSON.stringify(upd)}); }
          catch(colErr){ /* columnas nuevas aún no creadas: reintento sin domicilio/cod_postal/tel2 */
            const {domicilio,cod_postal,tel2,...updClasico}=upd;
            if(Object.keys(updClasico).length) await sbFetch('/proveedores?codigo=eq.'+encodeURIComponent(t.codigo),{method:'PATCH', body:JSON.stringify(updClasico)});
          }
        }
        const a=DIC.proveedores.find(x=>_syncNorm(x.codigo)===t.codigo);
        if(a){ CAMPOS.forEach(k=>{ if(t[k]) a[k]=t[k]; }); }
      }
      okMod++;
    }
    DIC.proveedores.sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo)));
    closeModal();
    toast('Listo: '+nuevos.length+' creados, '+okMod+' actualizados'+(DEMO_MODE?' (demo)':''));
    renderDic();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Aplicar cambios'; }
    toast('Error al aplicar: '+(e.message||e));
  }
}

      if(!DEMO_MODE){ for(let i=0;i<payload.length;i+=500){ await sbFetch('/depositos',{method:'POST', body:JSON.stringify(payload.slice(i,i+500))}); } }
      payload.forEach(p=>{ if(!DIC.depositos.some(x=>_syncNorm(x.codigo)===p.codigo)) DIC.depositos.push({...p}); });
    }
    let okMod=0;
    for(const m of modificados){
      const t=m.t;
      const upd={}; // solo campos con valor: un vacío de Tango nunca pisa lo existente
      CAMPOS.forEach(k=>{ if(t[k]) upd[k]=t[k]; });
      if(Object.keys(upd).length){
        if(!DEMO_MODE){ await sbFetch('/depositos?codigo=eq.'+encodeURIComponent(t.codigo),{method:'PATCH', body:JSON.stringify(upd)}); }
        const a=DIC.depositos.find(x=>_syncNorm(x.codigo)===t.codigo);
        if(a){ CAMPOS.forEach(k=>{ if(t[k]) a[k]=t[k]; }); }
      }
      okMod++;
    }
    DIC.depositos.sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo),'es',{numeric:true}));
    closeModal();
    toast('Listo: '+nuevos.length+' creados, '+okMod+' actualizados'+(DEMO_MODE?' (demo)':''));
    renderDic();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Aplicar cambios'; }
    toast('Error al aplicar: '+(e.message||e));
  }
}
window.syncDepositosAplicar=syncDepositosAplicar;

const _SYNC_CTA_CAMPOS=['desc','clase','tipo','saldo','usa_aux','habil'];
const _SYNC_CTA_COLS={desc:'descripcion',clase:'clase',tipo:'tipo',saldo:'saldo',usa_aux:'usa_aux',habil:'habil'};

async function syncCtaAnalizar(){
  const files=Array.from((document.getElementById('syncc_files').files)||[]);
  const msg=document.getElementById('synccMsg');
  const setErr=t=>{ msg.style.color='#b3261e'; msg.textContent=t; };
  if(!files.length){ setErr('Necesito al menos un archivo.'); return; }
  if(files.length>3){ setErr('Máximo 3 archivos a la vez.'); return; }
  msg.style.color='var(--muted)'; msg.textContent='Leyendo '+files.length+' archivo(s)…';
  try{
    const wbs=await Promise.all(files.map(f=>_syncReadWb(f)));
    const fuentes=[];
    wbs.forEach((wb,idx)=>{
      const rows=_syncSheetRows(wb, h=>_syncIdx(h,'Código')>=0 && _syncIdx(h,'Clase de cuenta')>=0);
      if(!rows) throw new Error('En '+files[idx].name+' no encontré columnas "Código" y "Clase de cuenta".');
      const H=rows[0];
      const iCod=_syncIdx(H,'Código'), iDesc=_syncIdx(H,'Descripción'), iClase=_syncIdx(H,'Clase de cuenta'),
            iTipo=_syncIdx(H,'Tipo de cuenta'), iSaldo=_syncIdx(H,'Saldo habitual'),
            iUsaAux=_syncIdx(H,'Usa auxiliares contables'), iHabil=_syncIdx(H,'Habilitado');
      const map={};
      for(let i=1;i<rows.length;i++){
        const c=_syncNorm(rows[i][iCod]); if(!c) continue;
        map[c]={ cod:c, desc:_syncNorm(rows[i][iDesc]), clase:_syncNorm(rows[i][iClase]), tipo:_syncNorm(rows[i][iTipo]),
                  saldo:_syncNorm(rows[i][iSaldo]), usa_aux:_syncNorm(rows[i][iUsaAux]), habil:_syncNorm(rows[i][iHabil]) };
      }
      fuentes.push({name:files[idx].name, map});
    });
    const allCods=new Set(); fuentes.forEach(fu=>Object.keys(fu.map).forEach(c=>allCods.add(c)));
    const merged={}, conflictos=[];
    allCods.forEach(c=>{
      const recs=fuentes.filter(fu=>fu.map[c]).map(fu=>({fuente:fu.name, rec:fu.map[c]}));
      const distintos=[];
      recs.forEach(r=>{
        const key=_SYNC_CTA_CAMPOS.map(k=>r.rec[k]).join('|');
        const ex=distintos.find(d=>d.key===key);
        if(ex) ex.fuentes.push(r.fuente); else distintos.push({key, rec:r.rec, fuentes:[r.fuente]});
      });
      if(distintos.length===1){ merged[c]=distintos[0].rec; }
      else{ conflictos.push({cod:c, opciones:distintos.map(d=>({rec:d.rec, fuentes:d.fuentes}))}); }
    });
    const app={}; (CONTA_DB.cuentas||[]).forEach(r=>{ app[_syncNorm(r.cod)]=r; });
    const nuevos=[], modificados=[];
    Object.keys(merged).sort().forEach(c=>{
      const t=merged[c], a=app[c];
      if(!a){ nuevos.push(t); return; }
      const diffs=[];
      _SYNC_CTA_CAMPOS.forEach(k=>{ if(t[k] && _syncNorm(a[k])!==t[k]) diffs.push([k,a[k]||'',t[k]]); });
      if(diffs.length) modificados.push({t,diffs});
    });
    const enAppNoTango=Object.keys(app).filter(c=>!allCods.has(c)).map(c=>app[c]);
    SYNC_CTA={nuevos, modificados, conflictos, enAppNoTango, totTango:allCods.size, resoluciones:{}};
    msg.style.color='var(--muted)';
    msg.textContent='Tango ('+fuentes.length+' archivo(s)): '+SYNC_CTA.totTango+' cuentas · App: '+(CONTA_DB.cuentas||[]).length+' cuentas.';
    renderSyncCtaReport();
  }catch(e){ setErr('Error: '+(e.message||e)); }
}
window.syncCtaAnalizar=syncCtaAnalizar;

async function syncCtaAplicar(){
  if(!ROLE.admin){ toast('Solo un administrador puede aplicar cambios.'); return; }
  if(!SYNC_CTA) return;
  const {nuevos, modificados, conflictos, resoluciones}=SYNC_CTA;
  const app={}; (CONTA_DB.cuentas||[]).forEach(r=>{ app[_syncNorm(r.cod)]=r; });
  const confResueltos=conflictos.filter(cf=>resoluciones[cf.cod]!==undefined).map(cf=>cf.opciones[resoluciones[cf.cod]].rec);
  const confNuevos=confResueltos.filter(t=>!app[t.cod]);
  const confModificados=confResueltos.filter(t=>app[t.cod]).map(t=>{
    const a=app[t.cod], diffs=[];
    _SYNC_CTA_CAMPOS.forEach(k=>{ if(t[k] && _syncNorm(a[k])!==t[k]) diffs.push([k,a[k]||'',t[k]]); });
    return {t,diffs};
  }).filter(m=>m.diffs.length);
  const todosNuevos=nuevos.concat(confNuevos);
  const todosModificados=modificados.concat(confModificados);
  if(!todosNuevos.length && !todosModificados.length){ toast('No hay cambios para aplicar.'); return; }
  const pendConf=conflictos.length - Object.keys(resoluciones).length;
  if(!confirm('Se van a CREAR '+todosNuevos.length+' cuenta(s) y ACTUALIZAR '+todosModificados.length+' en Supabase.'+(pendConf>0?' Quedan '+pendConf+' conflicto/s sin resolver: no se aplican.':'')+(DEMO_MODE?' (Estás en modo demo: solo cambia en memoria.)':'')+'\n¿Confirmás?')) return;
  const btn=document.getElementById('synccAplicarBtn'); if(btn){ btn.disabled=true; btn.textContent='Aplicando…'; }
  try{
    if(todosNuevos.length){
      const payload=todosNuevos.map(t=>({cod:t.cod, descripcion:t.desc, clase:t.clase, tipo:t.tipo, saldo:t.saldo, usa_aux:t.usa_aux, habil:t.habil}));
      if(!DEMO_MODE){ for(let i=0;i<payload.length;i+=500){ await sbFetch('/cuentas_contables',{method:'POST', body:JSON.stringify(payload.slice(i,i+500))}); } }
      payload.forEach(p=>{ if(!CONTA_DB.cuentas.some(x=>_syncNorm(x.cod)===p.cod)) CONTA_DB.cuentas.push({cod:p.cod, desc:p.descripcion, clase:p.clase, tipo:p.tipo, saldo:p.saldo, usa_aux:p.usa_aux, habil:p.habil, confidencial:false}); });
    }
    let okMod=0;
    for(const m of todosModificados){
      const t=m.t;
      const upd={}; // nunca toca 'confidencial': eso lo define Micaela a mano en la app
      _SYNC_CTA_CAMPOS.forEach(k=>{ if(t[k]) upd[_SYNC_CTA_COLS[k]]=t[k]; });
      if(Object.keys(upd).length){
        if(!DEMO_MODE){ await sbFetch('/cuentas_contables?cod=eq.'+encodeURIComponent(t.cod),{method:'PATCH', body:JSON.stringify(upd)}); }
        const a=CONTA_DB.cuentas.find(x=>_syncNorm(x.cod)===t.cod);
        if(a){ _SYNC_CTA_CAMPOS.forEach(k=>{ if(t[k]) a[k]=t[k]; }); }
      }
      okMod++;
    }
    CONTA_DB.cuentas.sort((a,b)=>String(a.cod).localeCompare(String(b.cod)));
    closeModal();
    toast('Listo: '+todosNuevos.length+' creadas, '+okMod+' actualizadas'+(pendConf>0?' ('+pendConf+' conflicto/s quedaron sin resolver)':'')+(DEMO_MODE?' (demo)':''));
    renderDic();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Aplicar cambios'; }
    toast('Error al aplicar: '+(e.message||e));
  }
}
window.syncCtaAplicar=syncCtaAplicar;

async function syncAuxAnalizar(){
  const inp=document.getElementById('synca_files'); const msg=document.getElementById('syncaMsg');
  const files=inp&&inp.files?[...inp.files]:[];
  if(!files.length){ if(msg)msg.textContent='Elegí al menos un archivo.'; return; }
  if(typeof XLSX==='undefined'){ if(msg)msg.textContent='Necesitás conexión para leer los Excel.'; return; }
  if(msg)msg.textContent='Leyendo '+files.length+' archivo(s)…';
  const norm=v=>String(v==null?'':v).trim();
  const union={}; const fileNames=files.map(f=>f.name);
  try{
    for(let fi=0; fi<files.length; fi++){
      const wb=XLSX.read(await files[fi].arrayBuffer(),{type:'array'});
      const shName=wb.SheetNames.find(n=>String(n).trim().toLowerCase()==='auxiliares')
                || wb.SheetNames.find(n=>/auxiliares/i.test(n) && !/tipos|tipo_|subaux/i.test(n))
                || wb.SheetNames.find(n=>/auxiliar/i.test(n) && !/tipos|tipo_|subaux/i.test(n));
      if(!shName) continue;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[shName],{header:1,defval:''});
      if(!rows.length) continue;
      const hdr=rows[0].map(h=>norm(h).toLowerCase());
      const ci={ tipo:hdr.findIndex(h=>h.includes('tipo')), cod:hdr.findIndex(h=>h==='código auxiliar'||h==='codigo auxiliar'||(h.includes('código')&&!h.includes('tipo'))), desc:hdr.findIndex(h=>h.includes('descrip')), hab:hdr.findIndex(h=>h.includes('habilit')) };
      for(let r=1;r<rows.length;r++){
        const row=rows[r]; const tipo=norm(row[ci.tipo]).replace(/^0+(\d)/, '$1').padStart(2,'0');
        const cod=norm(row[ci.cod]); const desc=norm(row[ci.desc]); const hab=norm(row[ci.hab]);
        if(!cod||!tipo) continue;
        if(tipo==='01') continue;                       // Aux 01 no se usa
        if(hab.toLowerCase()!=='si'&&hab.toLowerCase()!=='sí') continue;  // solo habilitados
        const tipoNum=String(parseInt(tipo,10));
        const key=tipoNum+'||'+cod.toUpperCase();
        const u=union[key]=union[key]||{tipo:tipoNum, cod, descs:new Set(), enArch:new Set()};
        u.descs.add(desc); u.enArch.add(fileNames[fi]);
      }
    }
    // clasificar vs estado actual (CONTA_DB.auxopc)
    const curIdx={};
    Object.keys(CONTA_DB.auxopc||{}).forEach(t=>{ (CONTA_DB.auxopc[t]||[]).forEach(o=>{ curIdx[t+'||'+String(o.cod).toUpperCase()]={desc:o.desc,habil:o.habil}; }); });
    const altas=[], cambios=[], iguales=[], conflictos=[];
    Object.values(union).forEach(u=>{
      const desc=[...u.descs][0]||'';
      if(u.descs.size>1){ conflictos.push({...u, descsArr:[...u.descs]}); return; }
      const cur=curIdx[u.tipo+'||'+u.cod.toUpperCase()];
      if(!cur) altas.push({tipo:u.tipo, cod:u.cod, desc});
      else if(norm(cur.desc)!==desc) cambios.push({tipo:u.tipo, cod:u.cod, desc, descAnt:cur.desc});
      else iguales.push(1);
    });
    SYNC_AUX={altas, cambios, iguales:iguales.length, conflictos, fileNames};
    renderSyncAuxReport();
  }catch(e){ if(msg)msg.textContent='Error al leer: '+(e.message||e); }
}
window.syncAuxAnalizar=syncAuxAnalizar;

  const box=document.getElementById('syncaReport'); const msg=document.getElementById('syncaMsg'); if(!box) return;
  const s=SYNC_AUX; if(!s){ box.innerHTML=''; return; }

  const tipoNom=t=>{ const x=(CONTA_DB.tipos||[]).find(y=>String(y.cod)===String(t)); return t+(x?' '+x.desc:''); };
  const tabla=(arr,cols)=>'<div class="dic-scroll" style="max-height:230px"><table class="grid" style="font-size:11.5px"><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  let h='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
    +'<span class="badge b-verde">Altas: '+s.altas.length+'</span>'
    +'<span class="badge b-ambar">Cambios de descripción: '+s.cambios.length+'</span>'
    +'<span class="badge">Sin cambios: '+s.iguales+'</span>'

async function syncClasifAnalizar(){
  const files=Array.from((document.getElementById('syncl_files').files)||[]);
  const msg=document.getElementById('synclMsg');
  const setErr=t=>{ msg.style.color='#b3261e'; msg.textContent=t; };
  if(!files.length){ setErr('Necesito al menos un archivo.'); return; }
  if(files.length>3){ setErr('Máximo 3 archivos a la vez.'); return; }
  msg.style.color='var(--muted)'; msg.textContent='Leyendo '+files.length+' archivo(s)…';
  try{
    const wbs=await Promise.all(files.map(f=>_syncReadWb(f)));
    const fuentes=[];
    wbs.forEach((wb,idx)=>{
      const rows=_syncSheetRows(wb, h=>_syncIdx(h,'Código')>=0 && _syncIdx(h,'Habilitado para Compras')>=0);
      if(!rows) throw new Error('En '+files[idx].name+' no encontré columnas "Código" y "Habilitado para Compras".');
      const H=rows[0];
      const iCod=_syncIdx(H,'Código'), iDesc=_syncIdx(H,'Descripción'),
            iHTes=_syncIdx(H,'Habilitado para Tesorería','Habilitado para Tesoreria'),
            iHComp=_syncIdx(H,'Habilitado para Compras'), iHVta=_syncIdx(H,'Habilitado para Ventas');
      const map={};
      for(let i=1;i<rows.length;i++){
        const c=_syncNorm(rows[i][iCod]); if(!c) continue;
        map[c]={ cod:c, descripcion:_syncNorm(rows[i][iDesc]),
                  habil_tes:iHTes>=0?_syncNorm(rows[i][iHTes]):'', habil_comp:_syncNorm(rows[i][iHComp]), habil_vta:iHVta>=0?_syncNorm(rows[i][iHVta]):'' };
      }
      fuentes.push({name:files[idx].name, map});
    });
    const allCods=new Set(); fuentes.forEach(fu=>Object.keys(fu.map).forEach(c=>allCods.add(c)));
    const merged={}, conflictos=[];
    allCods.forEach(c=>{
      const recs=fuentes.filter(fu=>fu.map[c]).map(fu=>({fuente:fu.name, rec:fu.map[c]}));
      const distintos=[];
      recs.forEach(r=>{
        const key=_SYNC_CLASIF_CAMPOS.map(k=>r.rec[k]).join('|');
        const ex=distintos.find(d=>d.key===key);
        if(ex) ex.fuentes.push(r.fuente); else distintos.push({key, rec:r.rec, fuentes:[r.fuente]});
      });
      if(distintos.length===1){ merged[c]=distintos[0].rec; }
      else{ conflictos.push({cod:c, opciones:distintos.map(d=>({rec:d.rec, fuentes:d.fuentes}))}); }
    });
    // comparar contra lo ya guardado (CLASIF_ALL incluye habilitados y deshabilitados)
    const appConocidos={}; (CLASIF_ALL||[]).forEach(r=>{ appConocidos[_syncNorm(r.cod)]=r; });
    const nuevos=[], modificados=[];
    Object.keys(merged).sort().forEach(c=>{
      const t=merged[c], a=appConocidos[c];
      if(!a){ nuevos.push(t); return; }
      const diffs=[];
      if(t.descripcion && _syncNorm(a.desc)!==t.descripcion) diffs.push(['Descripción', a.desc||'', t.descripcion]);
      if(t.habil_comp && _syncNorm(a.habil_comp)!==t.habil_comp) diffs.push(['Habilitado para Compras', a.habil_comp||'', t.habil_comp]);
      if(diffs.length) modificados.push({t,diffs});
    });
    // cobertura por base (en cuántos informes aparece cada código) y faltantes (habilitadas en la app que no vienen en ningún informe)
    const fileNames=fuentes.map(f=>f.name);
    const coverage={}; allCods.forEach(c=>{ coverage[c]=fuentes.filter(fu=>fu.map[c]).map(fu=>fu.name); });
    const parciales = fuentes.length>=2 ? [...allCods].filter(c=>coverage[c].length<fuentes.length).sort().map(c=>{
        const any=fuentes.find(fu=>fu.map[c]);
        return {cod:c, desc:(any&&any.map[c].descripcion)||'', en:coverage[c], falta:fileNames.filter(n=>!coverage[c].includes(n))};
      }) : [];
    const faltantes=(CLASIF_ALL||[]).filter(r=>String(r.habil_comp||'').toLowerCase()==='si' && !allCods.has(_syncNorm(r.cod)));
    SYNC_CLASIF={nuevos, modificados, conflictos, totTango:allCods.size, resoluciones:{}, catSel:{}, faltantes, parciales, nFiles:fuentes.length, fileNames};
    msg.style.color='var(--muted)';
    msg.textContent='Tango ('+fuentes.length+' archivo(s)): '+SYNC_CLASIF.totTango+' códigos · App: '+(CLASIF_ALL||[]).length+' · Faltantes: '+faltantes.length+(fuentes.length>=2?(' · No en las '+fuentes.length+': '+parciales.length):'')+'.';
    renderSyncClasifReport();
  }catch(e){ setErr('Error: '+(e.message||e)); }
}

async function syncClasifAplicar(){
  if(!ROLE.admin){ toast('Solo un administrador puede aplicar cambios.'); return; }
  if(!SYNC_CLASIF) return;
  const {nuevos, modificados, conflictos, resoluciones}=SYNC_CLASIF;
  const catSel=SYNC_CLASIF.catSel||{};
  const confResueltos=conflictos.filter(cf=>resoluciones[cf.cod]!==undefined).map(cf=>cf.opciones[resoluciones[cf.cod]].rec);
  const todos=nuevos.concat(modificados.map(m=>m.t)).concat(confResueltos);
  if(!todos.length){ toast('No hay cambios para aplicar.'); return; }
  const pendConf=conflictos.length - Object.keys(resoluciones).length;
  if(!confirm('Se van a guardar '+todos.length+' código(s) en Supabase (tabla clasif_comprobantes).'+(pendConf>0?' Quedan '+pendConf+' conflicto/s sin resolver: no se aplican.':'')+(DEMO_MODE?' (Estás en modo demo: solo cambia en memoria.)':'')+'\n¿Confirmás?')) return;
  const btn=document.getElementById('synclAplicarBtn'); if(btn){ btn.disabled=true; btn.textContent='Aplicando…'; }
  try{
    const payload=todos.map(t=>({cod:t.cod, descripcion:t.descripcion, habil_comp:t.habil_comp, habil_tes:t.habil_tes, habil_vta:t.habil_vta}));
    if(!DEMO_MODE){
      for(let i=0;i<payload.length;i+=500){
        await sbFetch('/clasif_comprobantes',{method:'POST', prefer:'resolution=merge-duplicates,return=representation', body:JSON.stringify(payload.slice(i,i+500))});
      }
      const conCat=nuevos.filter(t=>catSel[t.cod]);
      if(conCat.length){
        try{ for(const t of conCat){ await sbFetch('/clasif_comprobantes?cod=eq.'+encodeURIComponent(t.cod),{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({categoria:catSel[t.cod]})}); } }
        catch(e){ toast('Guardé los códigos, pero no las categorías nuevas (¿falta la columna categoria en Supabase?).'); }
      }
    }
    // refrescar CLASIF_ALL (todos, habilitados o no) y derivar CLASIF_RENGLON (solo habilitados) para la OG
    const mapAll={}; (CLASIF_ALL||[]).forEach(r=>{ mapAll[r.cod]=r; });
    payload.forEach(p=>{ const prev=mapAll[p.cod]; mapAll[p.cod]={cod:p.cod, desc:p.descripcion||p.cod, habil_comp:p.habil_comp||'No', categoria:catSel[p.cod]||(prev&&prev.categoria)||_catDe(p.cod)}; });
    CLASIF_ALL.length=0; Object.values(mapAll).sort((a,b)=>String(a.cod).localeCompare(String(b.cod))).forEach(r=>CLASIF_ALL.push(r));
    const habilitados=CLASIF_ALL.filter(r=>String(r.habil_comp||'').toLowerCase()==='si').map(r=>({codigo:r.cod, desc:r.desc}));
    CLASIF_RENGLON.length=0; habilitados.forEach(r=>CLASIF_RENGLON.push(r));
    CLASIF_FROM_SUPABASE=true;
    closeModal();
    toast('Listo: '+payload.length+' código(s) guardados'+(pendConf>0?' ('+pendConf+' conflicto/s quedaron sin resolver)':'')+(DEMO_MODE?' (demo)':''));
    renderDic();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Aplicar cambios'; }
    toast('Error al aplicar: '+(e.message||e));
  }
}
window.syncClasifAplicar=syncClasifAplicar;

/* ===== Sincronizar SERIES ACTIVAS (Módulos + Herramientas/Rodados/Muebles) con Tango ===== */
let SYNC_SERIES=null;
function _familiaDeposito(cod){
  const c=_syncNorm(cod);
  return /^[A-Za-z]{2}$/.test(c) ? 'modulo' : 'otros'; // 2 letras = módulo de alquiler; numérico u otro formato = herramientas/rodados/muebles
}
// Cruce en vivo Serie -> Auxiliar, usando lo que ya está cargado en CONTA_DB.auxopc (grupos 04 Módulo, 05 Mant. Bs Uso, 06 Muebles, 07 Herramientas, 08 Rodados).
// La clave real es la SERIE (no la descripción del artículo): en el Auxiliar de Tango la serie viene pegada dentro de la descripción ("SERIE - NOMBRE"), o sola cuando es un contenedor.
function _serieAuxIndex(grupos){
  const idx={};
  (grupos||['04','05','06','07','08']).forEach(g=>{
    ((CONTA_DB.auxopc&&CONTA_DB.auxopc[g])||[]).forEach(o=>{
      const d=String(o.desc||'');
      const sp=(d.includes(' - ')?d.split(' - ',1)[0]:d).trim().toUpperCase();
      if(!sp) return;
      (idx[sp]=idx[sp]||[]).push({grupo:g, cod:o.cod});
    });
  });
  return idx;
}
function _serieAuxTexto(idx, serie){
  const hits=idx[String(serie||'').trim().toUpperCase()];
  if(!hits||!hits.length) return '';
  if(hits.length===1) return 'Aux '+hits[0].grupo+' · '+hits[0].cod;
  return hits.map(h=>'Aux '+h.grupo+' · '+h.cod).join(' / ');
}
// Índice de Clasificación por serie: usa el prefijo de la descripción (lo que va antes de " - "), que es la serie. Mismo criterio que el cruce con Auxiliares.
function _clasifPorSerie(){
  const idx={};
  (CLASIF_ALL||[]).forEach(r=>{
    const d=String(r.desc||'');
    const sp=(d.includes(' - ')?d.split(' - ',1)[0]:d).trim().toUpperCase();
    if(!sp) return;
    (idx[sp]=idx[sp]||[]).push(r.cod);
  });
  return idx;
}
// Adjunta a cada fila de Series/Módulos su Auxiliar (_aux) y Clasificación (_clasif) derivados por serie, para poder mostrarlos, filtrarlos y ordenarlos como columnas.
function _enrichSeries(familia){
  const idxAux=_serieAuxIndex(familia==='modulo'?['04']:['05','06','07','08']);
  const idxClas=_clasifPorSerie();
  SERIES_ACTIVAS.forEach(r=>{
    if(r.familia!==familia) return;
    r._aux=_serieAuxTexto(idxAux, r.serie)||'—';
    const cs=idxClas[String(r.serie||'').trim().toUpperCase()];
    r._clasif=(cs&&cs.length)?Array.from(new Set(cs)).join(' / '):'—';
  });
}
// Cruce Código de Clasificación -> grupo de Auxiliar (02 EERR, 03 Instructivo, 04 Módulo, 05 Mant. Bs Uso, 06 Muebles, 07 Herramientas, 08 Rodados).
// Acá la clave es el CÓDIGO directo (no la serie): para clasificación, código de clasificación = código de auxiliar.
function _lazyFillCtaSelect(sel){
  if(sel.dataset.filled==='1') return;
  const cfVal=sel.dataset.cur||'';
  let html='<option value=""'+(cfVal===''?' selected':'')+'>— según artículo —</option>'
    +(CONTA_DB.cuentas||[]).filter(c=>String(c.habil||'').toLowerCase()!=='no').map(c=>'<option value="'+esc(c.cod)+'"'+(String(c.cod)===String(cfVal)?' selected':'')+'>'+esc(c.cod+' - '+(c.desc||''))+'</option>').join('');
  if(cfVal && !(CONTA_DB.cuentas||[]).some(c=>String(c.cod)===String(cfVal))) html+='<option value="'+esc(cfVal)+'" selected>'+esc(cfVal)+'</option>';
  sel.innerHTML=html;
  sel.dataset.filled='1';
}
window._lazyFillCtaSelect=_lazyFillCtaSelect;
function _clasifCodigoAGrupos(){
  const idx={};
  [['02','2'],['03','3'],['04','4'],['05','5'],['06','6'],['07','7'],['08','8']].forEach(function(p){
    const g=p[0], k=p[1];
    ((CONTA_DB.auxopc&&CONTA_DB.auxopc[k])||[]).forEach(o=>{
      const c=String(o.cod||'').trim().toUpperCase(); if(!c) return;
      (idx[c]=idx[c]||[]).push(g);
      const s=c.replace(/^\d+\)\s*/,'');            // "2) ACOPIO" -> "ACOPIO"
      if(s && s!==c) (idx[s]=idx[s]||[]).push(g);
    });
  });
  return idx;
}
function openSyncSeries(){

const _SYNC_SERIES_CAMPOS=['familia','cod_deposito','desc_deposito','cod_articulo','descripcion','comentario','adicional_1','adicional_2','codigo_barras','partida','numero_despacho'];

async function syncSeriesAnalizar(){
  const files=Array.from((document.getElementById('syncs_files').files)||[]);
  const msg=document.getElementById('syncsMsg');
  const setErr=t=>{ msg.style.color='#b3261e'; msg.textContent=t; };
  if(!files.length){ setErr('Necesito al menos un archivo.'); return; }
  if(files.length>3){ setErr('Máximo 3 archivos a la vez.'); return; }
  msg.style.color='var(--muted)'; msg.textContent='Leyendo '+files.length+' archivo(s)…';
  try{
    const wbs=await Promise.all(files.map(f=>_syncReadWb(f)));
    const merged={}; // serie -> record (última ocurrencia gana si aparece más de una vez)
    let totalFilas=0;
    wbs.forEach((wb)=>{
      (wb.SheetNames||[]).forEach(sn=>{
        const ws=wb.Sheets[sn];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        if(!rows.length) return;
        const H=rows[0];
        const iDep=_syncIdx(H,'Cód. Depósito','Cod. Deposito','Codigo Deposito'), iDepD=_syncIdx(H,'Descripción depósito','Descripcion deposito'),
              iArt=_syncIdx(H,'Cód. Artículo','Cod. Articulo','Codigo Articulo'), iDesc=_syncIdx(H,'Descripción','Descripcion'),
              iSerie=_syncIdx(H,'Serie'), iCom=_syncIdx(H,'Comentario'), iAd2=_syncIdx(H,'Adicional 2'),
              iBar=_syncIdx(H,'Código de Barras','Codigo de Barras'), iAd1=_syncIdx(H,'Adicional 1'),
              iPart=_syncIdx(H,'Partida'), iDesp=_syncIdx(H,'Número de Despacho','Numero de Despacho');
        if(iDep<0 || iSerie<0) return; // esta solapa no es un reporte de series activas
        for(let i=1;i<rows.length;i++){
          const serie=_syncNorm(rows[i][iSerie]); if(!serie) continue;
          const codDep=_syncNorm(rows[i][iDep]);
          merged[serie]={ serie, familia:_familiaDeposito(codDep), cod_deposito:codDep,
            desc_deposito:iDepD>=0?_syncNorm(rows[i][iDepD]):'', cod_articulo:iArt>=0?_syncNorm(rows[i][iArt]):'',
            descripcion:iDesc>=0?_syncNorm(rows[i][iDesc]):'', comentario:iCom>=0?_syncNorm(rows[i][iCom]):'',
            adicional_1:iAd1>=0?_syncNorm(rows[i][iAd1]):'', adicional_2:iAd2>=0?_syncNorm(rows[i][iAd2]):'',
            codigo_barras:iBar>=0?_syncNorm(rows[i][iBar]):'', partida:iPart>=0?_syncNorm(rows[i][iPart]):'',
            numero_despacho:iDesp>=0?_syncNorm(rows[i][iDesp]):'' };
          totalFilas++;
        }
      });
    });
    if(!totalFilas){ setErr('No encontré ninguna solapa con columnas "Cód. Depósito" y "Serie".'); return; }
    const appConocidas={}; (SERIES_ACTIVAS||[]).forEach(r=>{ appConocidas[r.serie]=r; });
    const nuevos=[], modificados=[];
    Object.keys(merged).sort().forEach(s=>{
      const t=merged[s], a=appConocidas[s];
      if(!a){ nuevos.push(t); return; }
      const diffs=[];
      _SYNC_SERIES_CAMPOS.forEach(k=>{ if(t[k] && _syncNorm(a[k])!==t[k]) diffs.push([k,a[k]||'',t[k]]); });
      if(diffs.length) modificados.push({t,diffs});
    });
    SYNC_SERIES={nuevos, modificados, totTango:Object.keys(merged).length};
    msg.style.color='var(--muted)';
    msg.textContent='Tango ('+files.length+' archivo(s), '+totalFilas+' fila(s)): '+SYNC_SERIES.totTango+' series · App: '+(SERIES_ACTIVAS||[]).length+' conocidas.';
    renderSyncSeriesReport();
  }catch(e){ setErr('Error: '+(e.message||e)); }
}

async function syncSeriesAplicar(){
  if(!ROLE.admin){ toast('Solo un administrador puede aplicar cambios.'); return; }
  if(!SYNC_SERIES) return;
  const {nuevos, modificados}=SYNC_SERIES;
  const todos=nuevos.concat(modificados.map(m=>m.t));
  if(!todos.length){ toast('No hay cambios para aplicar.'); return; }
  if(!confirm('Se van a guardar '+todos.length+' serie(s) en Supabase (tabla series_activas). Las series que no aparecen en el archivo quedan como estaban.'+(DEMO_MODE?' (Estás en modo demo: solo cambia en memoria.)':'')+'\n¿Confirmás?')) return;
  const btn=document.getElementById('syncsAplicarBtn'); if(btn){ btn.disabled=true; btn.textContent='Aplicando…'; }
  try{
    if(!DEMO_MODE){
      for(let i=0;i<todos.length;i+=500){
        await sbFetch('/series_activas',{method:'POST', prefer:'resolution=merge-duplicates,return=representation', body:JSON.stringify(todos.slice(i,i+500))});
      }
    }
    const map={}; (SERIES_ACTIVAS||[]).forEach(r=>{ map[r.serie]=r; });
    todos.forEach(t=>{ map[t.serie]=t; });
    SERIES_ACTIVAS.length=0; Object.values(map).sort((a,b)=>String(a.serie).localeCompare(String(b.serie))).forEach(r=>SERIES_ACTIVAS.push(r));
    SERIES_FROM_SUPABASE=true;
    closeModal();
    toast('Listo: '+todos.length+' serie(s) guardadas'+(DEMO_MODE?' (demo)':''));
    renderDic();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Aplicar cambios'; }
    toast('Error al aplicar: '+(e.message||e));
  }
}
window.syncSeriesAplicar=syncSeriesAplicar;

function auxRows(list, tipoCod){

  const s=AUX_SORT[tipoCod];
  if(s) list=list.slice().sort((a,b)=>String(a[s.col]==null?'':a[s.col]).localeCompare(String(b[s.col]==null?'':b[s.col]),'es',{numeric:true})*s.dir);

    const si=String(o.habil||'').toLowerCase()==='si';
    const chk=ROLE.admin?'<label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><input type="checkbox" '+(si?'checked':'')+' onclick="toggleHabilAuxOpt(\''+esc(tipoCod)+'\',\''+esc(o.cod)+'\')">habil.</label>'
                          :'<span style="font-size:11px;color:var(--muted)">'+(si?'Sí':'No')+'</span>';
    return '<div style="display:flex;gap:12px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);font-size:12.5px'+(si?'':';opacity:.55')+'"><span style="min-width:120px;font-weight:600">'+esc(o.cod)+'</span><span style="flex:1">'+esc(o.desc)+'</span>'+chk+'</div>'; }).join('')
    + (list.length>400?'<div style="padding:6px 9px;font-size:11px;color:var(--muted)">Mostrando 400 de '+list.length+'. Afiná la búsqueda.</div>':'');
}
function setAuxOpen(code){ AUX_OPEN = (AUX_OPEN===code?'':code); paintDic(); }

function auxSortHeader(tipoCod){
  const s=AUX_SORT[tipoCod];
  const arr=c=> (s&&s.col===c)?(s.dir===1?' ▲':' ▼'):'';
  const col=c=> (s&&s.col===c)?'#1a7a3a':'var(--muted)';
  return '<div id="auxhdr_'+esc(tipoCod)+'" style="display:flex;gap:12px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--line-strong);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700">'
    +'<span style="min-width:120px;cursor:pointer;user-select:none;color:'+col('cod')+'" onclick="auxSortToggle(\''+esc(tipoCod)+'\',\'cod\')" title="Ordenar">Código'+arr('cod')+'</span>'
    +'<span style="flex:1;cursor:pointer;user-select:none;color:'+col('desc')+'" onclick="auxSortToggle(\''+esc(tipoCod)+'\',\'desc\')" title="Ordenar">Descripción'+arr('desc')+'</span>'
    +'</div>';
}
function auxSortToggle(tipoCod, colName){
  const cur=AUX_SORT[tipoCod];
  if(!cur || cur.col!==colName) AUX_SORT[tipoCod]={col:colName, dir:1};
  else if(cur.dir===1) AUX_SORT[tipoCod]={col:colName, dir:-1};
  else delete AUX_SORT[tipoCod];
  // re-render solo este grupo (encabezado + lista), preservando lo escrito en el buscador
  const hdr=document.getElementById('auxhdr_'+tipoCod);
  if(hdr) hdr.outerHTML=auxSortHeader(tipoCod);
  if(typeof auxFilter==='function' && document.getElementById('auxlist_'+tipoCod)) auxFilter(tipoCod);
  else paintDic();

async function importClasifAnalizar(){
  const f=((document.getElementById('impcl_file')||{}).files||[])[0];
  const msg=document.getElementById('impclMsg');
  const setErr=t=>{ msg.style.color='#b3261e'; msg.textContent=t; };
  if(!f){ setErr('Elegí un archivo.'); return; }
  msg.style.color='var(--muted)'; msg.textContent='Leyendo '+f.name+'…';
  try{
    const wb=await _syncReadWb(f);
    const rows=_syncSheetRows(wb, h=>_syncIdx(h,'Código','Codigo')>=0);
    if(!rows) throw new Error('No encontré la columna "Código" en ninguna hoja.');
    const H=rows[0];
    const iCod=_syncIdx(H,'Código','Codigo'), iDesc=_syncIdx(H,'Descripción','Descripcion'), iHab=_syncIdx(H,'Habilitado para Compras','Habilitado');
    let iCat=_syncIdx(H,'Categoría','Categoria','Clasificación (tipo)','Tipo'); let catCol='columna "Categoría"';
    const maxCols=Math.max(...rows.map(r=>r.length));
    if(iCat<0){ if(maxCols>=4){ iCat=3; catCol='4ª columna (sin encabezado)'; } else { catCol='no detectada'; } }
    const fileMap={}, catCount={};
    for(let i=1;i<rows.length;i++){
      const c=_syncNorm(rows[i][iCod]).toUpperCase(); if(!c) continue;
      const cat= iCat>=0 ? _syncNorm(rows[i][iCat]).toUpperCase() : '';
      fileMap[c]={ cod:c, descripcion:iDesc>=0?_syncNorm(rows[i][iDesc]):'', habil_comp:iHab>=0?_syncNorm(rows[i][iHab]):'', categoria:cat };
      const key=cat||'(sin categoría)'; catCount[key]=(catCount[key]||0)+1;
    }
    const cur={}; (CLASIF_ALL||[]).forEach(r=>{ cur[_syncNorm(r.cod).toUpperCase()]=r; });
    const nuevos=[], cambios=[], iguales=[], sobrantes=[];
    Object.keys(fileMap).forEach(c=>{
      const t=fileMap[c], a=cur[c];
      if(!a){ nuevos.push(t); return; }
      const diffs=[];
      if(t.categoria!==_syncNorm(a.categoria).toUpperCase()) diffs.push(['Categoría', a.categoria||'—', t.categoria||'—']);
      if(t.habil_comp && _syncNorm(a.habil_comp).toLowerCase()!==t.habil_comp.toLowerCase()) diffs.push(['Habilitado', a.habil_comp||'—', t.habil_comp]);
      if(t.descripcion && _syncNorm(a.desc)!==t.descripcion) diffs.push(['Descripción', a.desc||'—', t.descripcion]);
      if(diffs.length) cambios.push({t,diffs}); else iguales.push(t);
    });
    Object.keys(cur).forEach(c=>{ if(!fileMap[c]) sobrantes.push(cur[c]); });
    SYNC_CLASIF_IMP={fileMap, nuevos, cambios, iguales, sobrantes, catCount, catCol, iCatOk:iCat>=0};
    msg.style.color='var(--muted)';
    msg.textContent='Archivo: '+Object.keys(fileMap).length+' códigos · Categoría leída de: '+catCol+' · App: '+(CLASIF_ALL||[]).length+'.';
    const ab=document.getElementById('impclAplicarBtn'); if(ab){ ab.disabled=false; ab.style.opacity=''; ab.textContent='Aplicar'; }
    renderImportClasifReport();
  }catch(e){ setErr('Error: '+(e.message||e)); }
}
window.importClasifAnalizar=importClasifAnalizar;

    +(S.sobrantes.length?('<label style="display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 2px"><input type="checkbox" id="impcl_del" checked> Borrar estas '+S.sobrantes.length+' de Supabase (es permanente)</label><div class="dic-scroll" style="max-height:30vh">'+cap(S.sobrantes,rowDel,400)+'</div>'):'<div style="font-size:12px;color:var(--muted);padding:4px">Ninguna: todo lo que está en Supabase también está en tu archivo.</div>')

  html+='<div style="font-size:11.5px;color:var(--muted);margin:6px 0">Se van a <strong>agregar/actualizar</strong> '+(S.nuevos.length+S.cambios.length)+' código(s). El borrado es opcional: desmarcá la casilla si no querés borrar.'+(DEMO_MODE?' Estás en modo demo: solo cambia en memoria.':'')+'</div>';

async function importClasifAplicar(){
  if(!ROLE.admin){ toast('Solo un administrador puede aplicar.'); return; }
  const S=SYNC_CLASIF_IMP; if(!S) return;
  const upserts=S.nuevos.concat(S.cambios.map(m=>m.t));
  const delChk=document.getElementById('impcl_del');
  const doDelete=!!(delChk && delChk.checked) && S.sobrantes.length>0;
  if(!upserts.length && !doDelete){ toast('No hay nada para aplicar.'); return; }
  if(!confirm('Se van a agregar/actualizar '+upserts.length+' código(s)'+(doDelete?(' y BORRAR '+S.sobrantes.length+' de Supabase (permanente, no se puede deshacer)'):'')+'.'+(DEMO_MODE?' (demo: solo memoria)':'')+'\n¿Confirmás?')) return;
  const btn=document.getElementById('impclAplicarBtn'); if(btn){ btn.disabled=true; btn.textContent='Aplicando…'; }
  try{
    if(!DEMO_MODE){
      const payload=upserts.map(t=>({cod:t.cod, descripcion:t.descripcion||t.cod, habil_comp:t.habil_comp||'No', categoria:t.categoria||null}));
      for(let i=0;i<payload.length;i+=500){
        await sbFetch('/clasif_comprobantes',{method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:JSON.stringify(payload.slice(i,i+500))});
      }
      if(doDelete){
        const cods=S.sobrantes.map(t=>t.cod);
        for(let i=0;i<cods.length;i+=80){
          const chunk=cods.slice(i,i+80).map(c=>encodeURIComponent(c)).join(',');
          await sbFetch('/clasif_comprobantes?cod=in.('+chunk+')',{method:'DELETE', prefer:'return=minimal'});
        }
      }
    }
    const mapAll={}; (CLASIF_ALL||[]).forEach(r=>{ mapAll[_syncNorm(r.cod).toUpperCase()]=r; });
    upserts.forEach(t=>{ const k=t.cod, prev=mapAll[k]; mapAll[k]={cod:t.cod, desc:t.descripcion||(prev&&prev.desc)||t.cod, habil_comp:t.habil_comp||(prev&&prev.habil_comp)||'No', categoria:t.categoria||(prev&&prev.categoria)||''}; });
    if(doDelete) S.sobrantes.forEach(t=>{ delete mapAll[_syncNorm(t.cod).toUpperCase()]; });
    CLASIF_ALL.length=0; Object.values(mapAll).sort((a,b)=>String(a.cod).localeCompare(String(b.cod),'es',{numeric:true})).forEach(r=>CLASIF_ALL.push(r));
    const habil=CLASIF_ALL.filter(r=>String(r.habil_comp||'').toLowerCase()==='si').map(r=>({codigo:r.cod, desc:r.desc}));
    CLASIF_RENGLON.length=0; habil.forEach(r=>CLASIF_RENGLON.push(r));
    CLASIF_FROM_SUPABASE=true;
    closeModal();
    toast('Importado: '+upserts.length+' agregados/actualizados'+(doDelete?(' · '+S.sobrantes.length+' borrados'):'')+(DEMO_MODE?' (demo)':''));
    SYNC_CLASIF_IMP=null;
    renderDic();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Aplicar'; }
    const em=String(e.message||e);
    if(/categoria/i.test(em)) toast('Parece que falta la columna "categoria" en Supabase. Corré: alter table clasif_comprobantes add column if not exists categoria text;');
    else toast('Error al aplicar: '+em);
  }
}
